name: Upstream Focused Acceptance

on:
  push:
    branches:
      - sync/upstream-safe-20261024
    paths:
      - .github/workflows/upstream-focused-acceptance.yml
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/upstream-focused-acceptance.yml
      - lib/features/chat/widgets/**
      - test/features/chat/widgets/**
      - test/features/home/widgets/chat_input_section_skills_test.dart
      - test/features/settings/pages/tool_schema_settings_entry_test.dart
      - tool/fetch_proot.sh
      - tool/restore_pinned_proot.py

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify pinned PRoot recovery unit tests
        run: |
          bash -n tool/fetch_proot.sh
          python3 -m unittest discover -s tool/tests -p 'test_restore_pinned_proot.py' -v
      - name: Verify wallpaper align and mask
        run: flutter test --reporter expanded test/features/chat/widgets/chat_assistant_background_test.dart
      - name: Verify desktop skills popup
        run: flutter test --reporter expanded test/features/home/widgets/chat_input_section_skills_test.dart
      - name: Verify settings navigation
        run: flutter test --reporter expanded test/features/settings/pages/tool_schema_settings_entry_test.dart
