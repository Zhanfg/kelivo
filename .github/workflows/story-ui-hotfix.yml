# temporary verifier; remove after the patch is committed
name: Story UI Reachability Hotfix

on:
  push:
    branches:
      - feat/story-runtime-foundation
    paths:
      - .github/workflows/story-ui-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/story-runtime-foundation
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Patch reachable Story entries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/settings/pages/settings_page.dart')
          s = p.read_text()
          import_anchor = "import '../../world_book/pages/world_book_page.dart';\n"
          imports = (
              "import '../../story_runtime/ui/story_studio_page.dart';\n"
              "import '../../story_runtime/ui/story_skill_manager_page.dart';\n"
          )
          if imports not in s:
              if import_anchor not in s:
                  raise SystemExit('settings import anchor not found')
              s = s.replace(import_anchor, import_anchor + imports, 1)

          section_anchor = "          const SizedBox(height: 12),\n          header(l10n.settingsPageModelsServicesSection),\n"
          section = """          const SizedBox(height: 12),
          header('Story Runtime'),
          _iosSectionCard(
            children: [
              _iosNavRow(
                context,
                icon: Lucide.BookOpen,
                label: 'Story Studio',
                onTap: () {
                  Navigator.of(context).push(
                    MaterialPageRoute(builder: (_) => const StoryStudioPage()),
                  );
                },
              ),
              _iosDivider(context),
              _iosNavRow(
                context,
                icon: Lucide.Layers,
                label: 'Skills',
                onTap: () {
                  Navigator.of(context).push(
                    MaterialPageRoute(
                      builder: (_) => const StorySkillManagerPage(),
                    ),
                  );
                },
              ),
            ],
          ),

          const SizedBox(height: 12),
          header(l10n.settingsPageModelsServicesSection),
"""
          if "header('Story Runtime')" not in s:
              if section_anchor not in s:
                  raise SystemExit('settings section anchor not found')
              s = s.replace(section_anchor, section, 1)
          p.write_text(s)
          PY
          dart format lib/features/settings/pages/settings_page.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: dart analyze --fatal-infos lib test
      - name: Story tests
        shell: bash
        run: |
          mapfile -t tests < <(find test -maxdepth 1 -type f -name 'story*_test.dart' | sort)
          flutter test --concurrency=1 "${tests[@]}"
      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/features/settings/pages/settings_page.dart; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/settings/pages/settings_page.dart
          git commit -m 'fix(story): expose Story Runtime in Settings'
          git push origin HEAD:feat/story-runtime-foundation
