name: Finalize Upstream Story Merge

on:
  push:
    branches:
      - probe/upstream-native-merge-20260920

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final candidate
        uses: actions/checkout@v4
        with:
          ref: sync/upstream-native-final-20260920
          fetch-depth: 0

      - name: Apply final warning and UI cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kelivo Upstream Sync"
          git config user.email "actions@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          # data_sync: story_skills is now handled by the unified asset-root
          # path; remove the obsolete private helper.
          p = "lib/core/services/backup/data_sync.dart"
          s = read(p)
          dead = """  Future<Directory> _getStorySkillsDir() async {
            final root = await AppDirectories.getAppDataDirectory();
            return Directory(p.join(root.path, 'story_skills'));
          }

          """
          if dead in s:
              s = s.replace(dead, "", 1)
          write(p, s)

          # Bottom tools: do not infer Story mode merely from a normal
          # conversation ID. Restore the Upload/Draw row lost during upstream
          # structural merge.
          p = "lib/features/chat/widgets/bottom_tools_sheet.dart"
          s = read(p)
          s = s.replace(
              "    final storyConversationId = this.storyConversationId ?? conversationId;\n",
              "    final storyConversationId = this.storyConversationId;\n",
              1,
          )
          anchor = """                    const SizedBox(height: 12),
                              _LearningAndClearSection(
          """
          row = """                    const SizedBox(height: 12),
                              Row(
                                children: [
                                  roundedAction(
                                    icon: Lucide.Paperclip,
                                    label: l10n.bottomToolsSheetUpload,
                                    onTap: onUpload,
                                  ),
                                  const SizedBox(width: 12),
                                  roundedAction(
                                    icon: Lucide.Brush,
                                    label:
                                        Localizations.localeOf(context).languageCode == 'zh'
                                        ? '绘画'
                                        : 'Draw',
                                    onTap: onDrawing,
                                  ),
                                ],
                              ),
                              const SizedBox(height: 12),
                              _LearningAndClearSection(
          """
          if "label: l10n.bottomToolsSheetUpload" not in s:
              if anchor not in s:
                  raise SystemExit("bottom_tools_sheet: upload/draw insertion anchor missing")
              s = s.replace(anchor, row, 1)
          write(p, s)

          # Home tools: route Story-only actions explicitly, and connect the
          # drawing action rather than leaving the helper dead.
          p = "lib/features/home/pages/home_page.dart"
          s = read(p)
          old = """                onUpload: () {
                          Navigator.of(ctx).maybePop();
                          _controller.onPickFiles();
                        },
                        onClear: () async {
          """
          new = """                onUpload: () {
                          Navigator.of(ctx).maybePop();
                          _controller.onPickFiles();
                        },
                        onDrawing: () {
                          Navigator.of(ctx).maybePop();
                          _startDrawingPrompt();
                        },
                        onClear: () async {
          """
          if "onDrawing: () {" not in s:
              if old not in s:
                  raise SystemExit("home_page: drawing callback anchor missing")
              s = s.replace(old, new, 1)

          old = """                assistantId: assistantId,
                        conversationId: _controller.currentConversation?.id,
                        onClose: () => Navigator.of(ctx).maybePop(),
          """
          new = """                assistantId: assistantId,
                        conversationId: _controller.currentConversation?.id,
                        storyConversationId: storyMode
                            ? _controller.currentConversation?.id
                            : null,
                        onClose: () => Navigator.of(ctx).maybePop(),
          """
          if "storyConversationId: storyMode" not in s:
              if old not in s:
                  raise SystemExit("home_page: story conversation anchor missing")
              s = s.replace(old, new, 1)
          write(p, s)

          print("Final cleanup applied")
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Regenerate localization
        run: flutter gen-l10n

      - name: Format cleanup files
        run: |
          dart format             lib/core/services/backup/data_sync.dart             lib/features/chat/widgets/bottom_tools_sheet.dart             lib/features/home/pages/home_page.dart

      - name: Commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "fix(sync): restore tool routing and clear analyzer warnings"
          git push origin HEAD:refs/heads/sync/upstream-native-final-20260920 --force

      - name: Analyze
        run: dart analyze --fatal-infos lib test integration_test

      - name: Story focused tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test --concurrency=1             test/story_runtime_foundation_test.dart             test/story_runtime_state_test.dart             test/story_runtime_machine_test.dart             test/story_runtime_controller_test.dart             test/story_runtime_assembler_test.dart             test/story_response_parser_test.dart             test/story_prompt_compiler_test.dart             test/story_worldline_memory_test.dart             test/story_world_tree_models_test.dart             test/story_skill_system_test.dart             test/core/services/tts/local_tts_test.dart             test/features/home/widgets/chat_input_bar_queue_test.dart             test/features/home/widgets/chat_input_bar_mobile_composer_test.dart
