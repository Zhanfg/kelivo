name: Finalize Upstream Story Merge

on:
  push:
    branches:
      - probe/upstream-native-merge-20260920

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final candidate
        uses: actions/checkout@v4
        with:
          ref: sync/upstream-native-final-20260920
          fetch-depth: 0

      - name: Apply final warning and UI cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kelivo Upstream Sync"
          git config user.email "actions@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def line_start(text, pos):
              return text.rfind("\n", 0, pos) + 1

          # Remove obsolete private helper. story_skills is covered by the
          # unified asset-root handling after the upstream merge.
          p = "lib/core/services/backup/data_sync.dart"
          s = read(p)
          marker = "  Future<Directory> _getStorySkillsDir() async {"
          if marker in s:
              start = s.index(marker)
              end = s.index("  Future<void> _copyRestoredFile", start)
              s = s[:start] + s[end:]
          write(p, s)

          # Bottom tools: a normal conversation ID must not imply Story mode.
          # Restore Upload/Draw controls before the existing learning section.
          p = "lib/features/chat/widgets/bottom_tools_sheet.dart"
          s = read(p)
          s = s.replace(
              "    final storyConversationId = this.storyConversationId ?? conversationId;\n",
              "    final storyConversationId = this.storyConversationId;\n",
              1,
          )
          if "label: l10n.bottomToolsSheetUpload" not in s:
              target = s.index("_LearningAndClearSection(")
              insert = line_start(s, target)
              indent = s[insert:target]
              row = (
                  indent + "Row(\n"
                  + indent + "  children: [\n"
                  + indent + "    roundedAction(\n"
                  + indent + "      icon: Lucide.Paperclip,\n"
                  + indent + "      label: l10n.bottomToolsSheetUpload,\n"
                  + indent + "      onTap: onUpload,\n"
                  + indent + "    ),\n"
                  + indent + "    const SizedBox(width: 12),\n"
                  + indent + "    roundedAction(\n"
                  + indent + "      icon: Lucide.Brush,\n"
                  + indent + "      label: Localizations.localeOf(context).languageCode == 'zh'\n"
                  + indent + "          ? '绘画'\n"
                  + indent + "          : 'Draw',\n"
                  + indent + "      onTap: onDrawing,\n"
                  + indent + "    ),\n"
                  + indent + "  ],\n"
                  + indent + "),\n"
                  + indent + "const SizedBox(height: 12),\n"
              )
              s = s[:insert] + row + s[insert:]
          # Remove the legacy second Learning/Clear block retained from the
          # pre-upstream Story sheet. The upstream section above is the single
          # authoritative session-skills/prompt/clear surface.
          legacy = "if (storyConversationId == null) ...["
          if legacy in s:
              start_token = s.index(legacy)
              start = line_start(s, start_token)
              indent = s[start:start_token]
              end_token = indent + "],\n"
              end = s.index(end_token, start_token) + len(end_token)
              s = s[:start] + s[end:]
          write(p, s)

          # Home tools: connect Draw, and pass a Story-scoped conversation ID
          # only when the Story workspace is active.
          p = "lib/features/home/pages/home_page.dart"
          s = read(p)
          bt = s.index("child: BottomToolsSheet(")

          if "onDrawing: () {" not in s[bt:]:
              upload = s.index("onUpload: () {", bt)
              on_clear = s.index("onClear: () async {", upload)
              insert = line_start(s, on_clear)
              indent = s[insert:on_clear]
              drawing = (
                  indent + "onDrawing: () {\n"
                  + indent + "  Navigator.of(ctx).maybePop();\n"
                  + indent + "  _startDrawingPrompt();\n"
                  + indent + "},\n"
              )
              s = s[:insert] + drawing + s[insert:]

          bt = s.index("child: BottomToolsSheet(")
          if "storyConversationId: storyMode" not in s[bt:]:
              conv = s.index(
                  "conversationId: _controller.currentConversation?.id,",
                  bt,
              )
              conv_end = s.index("\n", conv) + 1
              indent_start = line_start(s, conv)
              indent = s[indent_start:conv]
              story = (
                  indent + "storyConversationId: storyMode\n"
                  + indent + "    ? _controller.currentConversation?.id\n"
                  + indent + "    : null,\n"
              )
              s = s[:conv_end] + story + s[conv_end:]
          write(p, s)

          print("Final cleanup applied")
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Regenerate localization
        run: flutter gen-l10n

      - name: Format cleanup files
        run: dart format lib/core/services/backup/data_sync.dart lib/features/chat/widgets/bottom_tools_sheet.dart lib/features/home/pages/home_page.dart

      - name: Commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "fix(sync): restore tool routing and clear analyzer warnings"
          git push origin HEAD:refs/heads/sync/upstream-native-final-20260920 --force

      - name: Analyze
        run: dart analyze --fatal-infos lib test integration_test

      - name: Story focused tests
        shell: bash
        run: flutter test --concurrency=1 test/story_runtime_foundation_test.dart test/story_runtime_state_test.dart test/story_runtime_machine_test.dart test/story_runtime_controller_test.dart test/story_runtime_assembler_test.dart test/story_response_parser_test.dart test/story_prompt_compiler_test.dart test/story_worldline_memory_test.dart test/story_world_tree_models_test.dart test/story_skill_system_test.dart test/core/services/tts/local_tts_test.dart test/features/home/widgets/chat_input_bar_queue_test.dart test/features/home/widgets/chat_input_bar_mobile_composer_test.dart
