name: Story MCP Profile UI

on:
  push:
    branches:
      - feat/story-mcp-profile-ui-20260920

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format Story MCP files
        run: |
          dart format             lib/features/story_runtime/mcp/story_mcp_profile_store.dart             lib/features/story_runtime/ui/story_mcp_profile_page.dart             lib/features/story_runtime/ui/story_mode_runtime_page.dart             test/story_mcp_profile_store_test.dart
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "Kelivo Story MCP"
          git config user.email "actions@users.noreply.github.com"
          git add             lib/features/story_runtime/mcp/story_mcp_profile_store.dart             lib/features/story_runtime/ui/story_mcp_profile_page.dart             lib/features/story_runtime/ui/story_mode_runtime_page.dart             test/story_mcp_profile_store_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(story): format MCP profile UI"
            git push origin HEAD:refs/heads/feat/story-mcp-profile-ui-20260920
          fi
      - run: dart analyze --fatal-infos lib test integration_test
      - name: Story MCP regression
        run: |
          flutter test --concurrency=2             test/story_mcp_profile_store_test.dart             test/story_runtime_foundation_test.dart             test/story_skill_system_test.dart
