name: Story Audit Improvements

on:
  push:
    branches:
      - feat/story-audit-improvements-20260920

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format Story audit files
        run: dart format lib/features/story_runtime/serialization/story_serialization_service.dart lib/features/chat/widgets/bottom_tools_sheet.dart test/story_serialization_restore_test.dart test/story_world_tree_coordinator_test.dart test/features/chat/widgets/bottom_tools_sheet_test.dart
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "Kelivo Story Audit"
          git config user.email "actions@users.noreply.github.com"
          git add lib/features/story_runtime/serialization/story_serialization_service.dart lib/features/chat/widgets/bottom_tools_sheet.dart test/story_serialization_restore_test.dart test/story_world_tree_coordinator_test.dart test/features/chat/widgets/bottom_tools_sheet_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(story): format audit improvements"
            git push origin HEAD:refs/heads/feat/story-audit-improvements-20260920
          fi
      - run: dart analyze --fatal-infos lib test integration_test
      - run: flutter test --concurrency=1 test/story_serialization_restore_test.dart test/story_world_tree_coordinator_test.dart test/features/chat/widgets/bottom_tools_sheet_test.dart
