name: Story Audit Improvements

on:
  push:
    branches:
      - feat/story-audit-improvements-20260920

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/features/story_runtime/serialization/story_serialization_service.dart lib/features/chat/widgets/bottom_tools_sheet.dart test/story_serialization_restore_test.dart test/features/chat/widgets/bottom_tools_sheet_test.dart
      - run: dart analyze --fatal-infos lib test integration_test
      - run: flutter test --concurrency=1 test/story_serialization_restore_test.dart test/features/chat/widgets/bottom_tools_sheet_test.dart
