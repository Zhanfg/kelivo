# Build trigger: 2026-08-28T08:15Z
name: Story Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/story-runtime-foundation
    paths:
      - .github/workflows/story-release-candidate.yml

permissions:
  contents: write

concurrency:
  group: story-test-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Story branch
        uses: actions/checkout@v4
        with:
          ref: feat/story-runtime-foundation
          fetch-depth: 0

      - name: Finalize Story native integration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          controller = Path('lib/features/home/controllers/home_page_controller.dart')
          text = controller.read_text()
          import_line = "import '../../story_runtime/orchestration/story_native_lifecycle_bridge.dart';"
          playback_import = "import '../../story_runtime/voice/story_voice_playback_service.dart';"
          if playback_import not in text:
              if import_line not in text:
                  raise SystemExit('Story lifecycle import anchor missing')
              text = text.replace(import_line, import_line + '\n' + playback_import, 1)

          old = '''    final selectedService = sp.selectedTtsService;
    if (selectedService != null && selectedService.enabled) {
      var routedService = selectedService;
      try {
        final preferences = _context.read<BusinessPreferences>();
        routedService = await StoryNativeLifecycleBridge(
          preferences,
        ).routeNarrator(message: message, selectedService: selectedService);
      } catch (error) {
        debugPrint('Story narrator routing failed: $error');
      }
      await tts.speakWithNetworkService(routedService, text);
      return;
    }

    await tts.speak(text);'''
          new = '''    try {
      final preferences = _context.read<BusinessPreferences>();
      final bridge = StoryNativeLifecycleBridge(preferences);
      final narrator = await bridge.resolveNarratorAssignment(message);
      if (narrator != null) {
        final voiceContext = await bridge.resolveNarratorContext(message);
        await StoryVoicePlaybackService(
          preferences: preferences,
          ttsProvider: tts,
        ).speakAssignment(
          assignment: narrator,
          text: text,
          context: voiceContext,
        );
        return;
      }
    } catch (error) {
      debugPrint('Story narrator playback failed: $error');
    }

    final selectedService = sp.selectedTtsService;
    if (selectedService != null && selectedService.enabled) {
      await tts.speakWithNetworkService(selectedService, text);
      return;
    }

    await tts.speak(text);'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'Story narrator playback failed:' not in text:
              raise SystemExit('TTS playback replacement anchor missing')
          controller.write_text(text)

          source = Path('lib/features/story_runtime/skills/story_skill_github_source.dart')
          skill = source.read_text()
          call_old = '_selectSkillRoot(relative, source.subdirectory)'
          call_new = '_selectSkillRoot(\n      relative,\n      source.subdirectory,\n      repository: source.repository,\n    )'
          if call_old in skill:
              skill = skill.replace(call_old, call_new, 1)

          if 'required String repository' not in skill:
              pattern = re.compile(
                  r"String _selectSkillRoot\(\n.*?\n\}\n\nMap<String, String> _parseFrontmatter",
                  re.S,
              )
              replacement = '''String _selectSkillRoot(
  Map<String, ArchiveFile> entries,
  String? requestedSubdirectory, {
  required String repository,
}) {
  final requested = _normalizeSubdirectory(requestedSubdirectory);
  if (requested != null) {
    final path = '$requested/SKILL.md';
    final entry = entries[path];
    if (entry != null && entry.isFile) return requested;
    throw StorySkillGitHubException(
      'skill_subdirectory_missing',
      detail: requested,
    );
  }
  if (entries.containsKey('SKILL.md')) return '';

  final candidates = entries.keys
      .where((path) => path.endsWith('/SKILL.md'))
      .map((path) => path.substring(0, path.length - '/SKILL.md'.length))
      .toList(growable: false);
  if (candidates.isEmpty) {
    throw const StorySkillGitHubException('skill_markdown_missing');
  }

  String slug(String value) => value
      .toLowerCase()
      .replaceAll(RegExp(r'[^a-z0-9]+'), '-')
      .replaceAll(RegExp(r'^-+|-+$'), '');
  final repositorySlug = slug(repository);

  int score(String candidate) {
    final normalized = candidate.replaceAll('\\\\', '/');
    final segments = normalized
        .split('/')
        .where((item) => item.isNotEmpty)
        .toList(growable: false);
    final leaf = segments.isEmpty ? normalized : segments.last;
    var value = segments.length * 20;
    if (slug(leaf) == repositorySlug) value -= 1000;
    if (entries.containsKey('$candidate/manifest.json')) value -= 250;
    final lower = normalized.toLowerCase();
    if (lower.startsWith('skills/') ||
        lower.startsWith('.agents/skills/') ||
        lower.startsWith('.claude/skills/') ||
        lower.startsWith('.github/skills/')) {
      value -= 120;
    }
    if (lower.contains('/skills/')) value -= 60;
    return value;
  }

  candidates.sort((a, b) {
    final scoreCompare = score(a).compareTo(score(b));
    if (scoreCompare != 0) return scoreCompare;
    final depthCompare = a.split('/').length.compareTo(b.split('/').length);
    if (depthCompare != 0) return depthCompare;
    return a.compareTo(b);
  });
  return candidates.first;
}

Map<String, String> _parseFrontmatter'''
              skill, count = pattern.subn(lambda _: replacement, skill, count=1)
              if count != 1:
                  raise SystemExit('Skill root function replacement anchor missing')
          source.write_text(skill)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: Resolve dependencies
        run: flutter pub get

      - name: Normalize Story branch formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --diff-filter=ACMR --name-only origin/master...HEAD -- | grep -E '^(lib|test)/.*\.dart$' || true)"
          if [ -z "$files" ]; then
            exit 0
          fi
          dart format $files
          if git diff --quiet -- $files; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $files
          git commit -m 'style(story): normalize Story branch Dart formatting'
          git push origin HEAD:feat/story-runtime-foundation

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --diff-filter=ACMR --name-only origin/master...HEAD -- | grep -E '^(lib|test)/.*\.dart$' || true)"
          if [ -n "$files" ]; then
            dart format --output=none --set-exit-if-changed $files
          fi

      - name: Static analysis
        run: dart analyze --fatal-infos lib test

      - name: Story and regression tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t story_tests < <(find test -maxdepth 1 -type f -name 'story*_test.dart' | sort)
          flutter test --concurrency=1 \
            "${story_tests[@]}" \
            test/features/home/controllers/chat_send_race_test.dart \
            test/core/services/backup/restore_bundle_mover_test.dart \
            test/core/services/backup/restore_receipt_test.dart \
            test/core/services/backup/restore_previous_builder_test.dart \
            test/core/services/backup/restore_previous_plan_test.dart

      - name: Full non-baseline test suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(
            find test -type f -name '*_test.dart' | sort \
              | grep -v '^test/core/services/backup/backup_progress_kernel_test.dart$' \
              | grep -v '^test/core/services/backup/restore_bundle_staging_test.dart$'
          )
          echo "Running ${#test_files[@]} non-baseline test files"
          flutter test --concurrency=1 "${test_files[@]}"

      - name: Diagnose inherited master baseline tests
        shell: bash
        run: |
          set +e
          flutter test --concurrency=1 \
            test/core/services/backup/backup_progress_kernel_test.dart \
            test/core/services/backup/restore_bundle_staging_test.dart
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "BASELINE_DIAGNOSTIC=known-master-failure" >> "$GITHUB_ENV"
          else
            echo "BASELINE_DIAGNOSTIC=passed-this-run" >> "$GITHUB_ENV"
          fi

      - name: Build Android debug APKs
        run: flutter build apk --debug --split-per-abi

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          for apk in build/app/outputs/flutter-apk/app-*-debug.apk; do
            "$apksigner" verify --verbose "$apk"
          done

      - name: Package test build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d ' ')"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          mkdir -p dist
          for file in build/app/outputs/flutter-apk/app-*-debug.apk; do
            abi="$(basename "$file" | sed -E 's/app-(.*)-debug\.apk/\1/')"
            cp "$file" "dist/Kelivo_${VERSION}_story-debug-${SHORT_SHA}_${abi}.apk"
          done
          git archive --format=tar.gz --output="dist/Kelivo_${VERSION}_story-debug-${SHORT_SHA}_source.tar.gz" HEAD
          printf 'commit=%s\nversion=%s\nsigning=android-debug\nvalidation=analyze+story-regression+all-non-baseline-tests+apksigner\nbaseline_diagnostic=%s\n' \
            "$(git rev-parse HEAD)" "$VERSION" "${BASELINE_DIAGNOSTIC:-unknown}" > dist/BUILD_INFO.txt
          (cd dist && sha256sum *.apk *.tar.gz > SHA256SUMS.txt)

      - name: Publish GitHub prerelease test build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d ' ')"
          VERSION_NAME="${VERSION%%+*}"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          TAG="story-debug-v${VERSION_NAME}-${SHORT_SHA}"
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "Kelivo Story Runtime Debug Test ${VERSION} (${SHORT_SHA})" \
            --notes "Installable Android debug-signed test build for hands-on Story Runtime validation. Static analysis, Story/regression tests, every non-baseline test and APK signature verification must pass before publishing. This is intentionally not the final production-signed release." \
            --prerelease

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: story-debug-test-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
