name: Story Release Candidate

on:
  push:
    branches:
      - feat/story-runtime-foundation
    paths:
      - .github/workflows/story-release-candidate.yml

permissions:
  contents: read

jobs:
  android-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/story-runtime-foundation
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: Configure signing when available
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${SIGN_KEYSTORE_BASE64:-}" ]; then
            echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
            {
              echo "storeFile=key.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED_BUILD=false" >> "$GITHUB_ENV"
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --diff-filter=ACMR --name-only origin/master...HEAD -- | grep -E '^(lib|test)/.*\.dart$' || true)"
          if [ -n "$files" ]; then
            dart format --output=none --set-exit-if-changed $files
          fi

      - name: Static analysis
        run: dart analyze --fatal-infos lib test

      - name: Full tests
        run: flutter test

      - name: Build Android release APKs
        run: flutter build apk --release --split-per-abi

      - name: Package candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d ' ')"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          mkdir -p dist
          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$file" | sed -E 's/app-(.*)-release\.apk/\1/')"
            cp "$file" "dist/Kelivo_${VERSION}_story-${SHORT_SHA}_${abi}.apk"
          done
          git archive --format=tar.gz --output="dist/Kelivo_${VERSION}_story-${SHORT_SHA}_source.tar.gz" HEAD
          printf 'commit=%s\nversion=%s\nsigned=%s\n' "$(git rev-parse HEAD)" "$VERSION" "${SIGNED_BUILD:-false}" > dist/BUILD_INFO.txt
          (cd dist && sha256sum *.apk *.tar.gz > SHA256SUMS.txt)

      - name: Upload candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: story-release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 7
