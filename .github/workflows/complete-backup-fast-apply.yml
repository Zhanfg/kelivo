name: Complete Backup Fast Apply

on:
  push:
    branches:
      - feat/story-runtime-foundation
    paths:
      - .github/workflows/complete-backup-fast-apply.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/story-runtime-foundation
          fetch-depth: 0

      - name: Apply complete-backup integration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          def r(path, old, new):
              p = Path(path); text = p.read_text()
              if new and new in text: return
              if old not in text: raise SystemExit(f'anchor missing: {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))
          ds='lib/core/services/backup/data_sync.dart'
          r(ds,"      final fontsDirPath = (await _getFontsDir()).path;\n","      final fontsDirPath = (await _getFontsDir()).path;\n      final storySkillsDirPath = (await _getStorySkillsDir()).path;\n")
          r(ds,"          fontsDirPath: fontsDirPath,\n        ),","          fontsDirPath: fontsDirPath,\n          storySkillsDirPath: storySkillsDirPath,\n        ),")
          r(ds,"      fontsDirPath: args.fontsDirPath,\n      ctx: ctx,","      fontsDirPath: args.fontsDirPath,\n      storySkillsDirPath: args.storySkillsDirPath,\n      ctx: ctx,")
          r(ds,"    required String fontsDirPath,\n    BackupIsolateContext? ctx,","    required String fontsDirPath,\n    required String storySkillsDirPath,\n    BackupIsolateContext? ctx,")
          r(ds,"    final fontFiles = includeFiles ? _listFilesSync(fontsDirPath) : const <File>[];\n    var totalBytes = _fileSizeSync(settingsPath) + _fileSizeSync(databasePath);\n    for (final file in [...uploadFiles, ...avatarFiles, ...imageFiles, ...fontFiles]) {","    final fontFiles = includeFiles ? _listFilesSync(fontsDirPath) : const <File>[];\n    final storySkillFiles = includeFiles ? _listFilesSync(storySkillsDirPath) : const <File>[];\n    var totalBytes = _fileSizeSync(settingsPath) + _fileSizeSync(databasePath);\n    for (final file in [...uploadFiles, ...avatarFiles, ...imageFiles, ...fontFiles, ...storySkillFiles]) {")
          r(ds,"          files: fontFiles,\n        );\n      }","          files: fontFiles,\n        );\n        _addDirectoryToZip(\n          writer,\n          storySkillsDirPath,\n          'story_skills',\n          entries,\n          collisionKeys,\n          files: storySkillFiles,\n        );\n      }")
          r(ds,"          name.startsWith('images/') ||\n          name.startsWith('fonts/');","          name.startsWith('images/') ||\n          name.startsWith('fonts/') ||\n          name.startsWith('story_skills/');")
          r(ds,"              name.startsWith('images/') ||\n              name.startsWith('fonts/'))) {","              name.startsWith('images/') ||\n              name.startsWith('fonts/') ||\n              name.startsWith('story_skills/'))) {")
          r(ds,"  Future<Directory> _getFontsDir() async {\n    return await AppDirectories.getFontsDirectory();\n  }\n","  Future<Directory> _getFontsDir() async {\n    return await AppDirectories.getFontsDirectory();\n  }\n\n  Future<Directory> _getStorySkillsDir() async {\n    final root = await AppDirectories.getAppDataDirectory();\n    return Directory(p.join(root.path, 'story_skills'));\n  }\n")
          r(ds,"  /// fonts) into the live directories without deleting anything already","  /// fonts/story_skills) into the live directories without deleting anything already")
          r(ds,"          (entryName: 'fonts', resolveTarget: _getFontsDir),\n        ];","          (entryName: 'fonts', resolveTarget: _getFontsDir),\n          (entryName: 'story_skills', resolveTarget: _getStorySkillsDir),\n        ];")
          r(ds,"    required this.fontsDirPath,\n  });","    required this.fontsDirPath,\n    required this.storySkillsDirPath,\n  });")
          r(ds,"  final String fontsDirPath;\n}","  final String fontsDirPath;\n  final String storySkillsDirPath;\n}")
          r(ds,"  void writeBackReference(int distance, int count) {\n","  @override\n  void writeBackReference(int distance, int count) {\n")
          r('lib/core/services/backup/restore_bundle_staging.dart',"  static const _assetRoots = ['upload', 'images', 'avatars', 'fonts'];","  static const _assetRoots = ['upload', 'images', 'avatars', 'fonts', 'story_skills'];")
          r('lib/core/services/backup/restore_previous_plan.dart',"  static const rootNames = ['upload', 'images', 'avatars', 'fonts'];","  static const rootNames = ['upload', 'images', 'avatars', 'fonts', 'story_skills'];")
          r('pubspec.yaml',"  crypto: ^3.0.3\n","  crypto: ^3.0.3\n  cryptography: ^2.9.0\n")
          codec='lib/core/services/backup/encrypted_full_backup.dart'
          r(codec,"    BackupProgressSink? onProgress,\n    BackupCancelToken? cancelToken,\n  }) async {\n    _validatePassword(password);","    BackupProgressSink? onProgress,\n    BackupCancelToken? cancelToken,\n    Directory? temporaryDirectory,\n  }) async {\n    _validatePassword(password);")
          r(codec,"    final temp = await getTemporaryDirectory();\n    final work = Directory(\n      p.join(\n        temp.path,\n        'kelivo_encrypted_","    final temp = temporaryDirectory ?? await getTemporaryDirectory();\n    final work = Directory(\n      p.join(\n        temp.path,\n        'kelivo_encrypted_")
          text=Path(codec).read_text(); marker='  static Future<File> decryptToTemporaryFile({'; pos=text.index(marker); head=text[:pos]; tail=text[pos:]
          old="    BackupProgressSink? onProgress,\n    BackupCancelToken? cancelToken,\n  }) async {\n    _validatePassword(password);"; new="    BackupProgressSink? onProgress,\n    BackupCancelToken? cancelToken,\n    Directory? temporaryDirectory,\n  }) async {\n    _validatePassword(password);"
          if new not in tail:
              if old not in tail: raise SystemExit('decrypt signature anchor missing')
              tail=tail.replace(old,new,1)
          old="    final temp = await getTemporaryDirectory();\n    final work = Directory(\n      p.join(\n        temp.path,\n        'kelivo_decrypted_"; new="    final temp = temporaryDirectory ?? await getTemporaryDirectory();\n    final work = Directory(\n      p.join(\n        temp.path,\n        'kelivo_decrypted_"
          if new not in tail:
              if old not in tail: raise SystemExit('decrypt temp anchor missing')
              tail=tail.replace(old,new,1)
          Path(codec).write_text(head+tail)
          helper='lib/features/backup/encrypted_full_backup_actions.dart'
          helper_path=Path(helper)
          helper_text=helper_path.read_text()
          helper_text=helper_text.replace("import '../../core/services/backup/backup_cancel_token.dart';\n", "", 1)
          helper_path.write_text(helper_text)
          ui='lib/features/backup/pages/backup_page.dart'
          r(ui,"import '../../../core/services/backup/data_sync.dart';\n","import '../../../core/services/backup/data_sync.dart';\nimport '../encrypted_full_backup_actions.dart';\n")
          r(ui,"        children: [\n          _iosNavRow(\n            context,\n            icon: Lucide.Export,\n            label: l10n.backupPageExportToFile,","        children: [\n          _iosNavRow(\n            context,\n            icon: Lucide.Export,\n            label: Localizations.localeOf(context).languageCode.startsWith('zh') ? '导出完整加密备份' : 'Export encrypted complete backup',\n            onTap: () => exportEncryptedFullBackupAction(context, vm),\n          ),\n          _iosDivider(context),\n          _iosNavRow(\n            context,\n            icon: Lucide.Import2,\n            label: Localizations.localeOf(context).languageCode.startsWith('zh') ? '恢复完整加密备份' : 'Restore encrypted complete backup',\n            onTap: () => importEncryptedFullBackupAction(context, vm),\n          ),\n          _iosDivider(context),\n          _iosNavRow(\n            context,\n            icon: Lucide.Export,\n            label: l10n.backupPageExportToFile,")
          PY
          git diff --check

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Resolve dependencies and format
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/core/services/backup/encrypted_full_backup.dart lib/core/providers/backup_provider.dart lib/core/services/backup/data_sync.dart lib/core/services/backup/restore_bundle_staging.dart lib/core/services/backup/restore_previous_plan.dart lib/features/backup/encrypted_full_backup_actions.dart lib/features/backup/pages/backup_page.dart test/encrypted_full_backup_test.dart
          git diff --check

      - name: Analyze encrypted backup integration
        run: dart analyze --fatal-infos lib/core/services/backup lib/core/providers/backup_provider.dart lib/features/backup/encrypted_full_backup_actions.dart lib/features/backup/pages/backup_page.dart test/encrypted_full_backup_test.dart

      - name: Test encrypted complete backup
        run: flutter test test/encrypted_full_backup_test.dart

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/complete-backup-fast-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml lib/core/services/backup/encrypted_full_backup.dart lib/core/providers/backup_provider.dart lib/core/services/backup/data_sync.dart lib/core/services/backup/restore_bundle_staging.dart lib/core/services/backup/restore_previous_plan.dart lib/features/backup/encrypted_full_backup_actions.dart lib/features/backup/pages/backup_page.dart test/encrypted_full_backup_test.dart
          git commit -m "feat(backup): finish encrypted complete backups"
          git push origin HEAD:feat/story-runtime-foundation
