name: Temporary FreeBuff Formatter

permissions:
  contents: write

on:
  push:
    branches:
      - feat/provider-compat-opencode-free

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-compat-opencode-free
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Format FreeBuff integration files
        run: |
          dart format \
            lib/core/models/provider_oauth.dart \
            lib/core/services/auth/provider_oauth_adapter.dart \
            lib/core/services/auth/freebuff_oauth_adapter.dart \
            lib/core/services/auth/provider_oauth_service.dart \
            lib/core/services/api/openai_compatible_presets.dart \
            lib/features/provider/widgets/oauth_login_panel.dart \
            lib/utils/brand_assets.dart \
            test/core/services/auth/provider_oauth_adapter_test.dart \
            test/core/services/api/providers/openai/openai_protocol_compat_test.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/core/models/provider_oauth.dart \
            lib/core/services/auth/provider_oauth_adapter.dart \
            lib/core/services/auth/freebuff_oauth_adapter.dart \
            lib/core/services/auth/provider_oauth_service.dart \
            lib/core/services/api/openai_compatible_presets.dart \
            lib/features/provider/widgets/oauth_login_panel.dart \
            lib/utils/brand_assets.dart \
            test/core/services/auth/provider_oauth_adapter_test.dart \
            test/core/services/api/providers/openai/openai_protocol_compat_test.dart
          git commit -m "style: format FreeBuff OAuth integration"
          git push origin HEAD:feat/provider-compat-opencode-free
