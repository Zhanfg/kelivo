name: Promote Verified Story Merge

on:
  push:
    branches:
      - probe/upstream-native-merge-20260920

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified candidate
        uses: actions/checkout@v4
        with:
          ref: sync/upstream-native-final-20260920
          fetch-depth: 0

      - name: Promote with lease
        shell: bash
        run: |
          set -euo pipefail
          expected="245128eded47ee573223cd66857883dc933d0f84"
          target="feat/story-runtime-foundation"
          candidate="9ed91c23fceefc3f589f45f06f4dc72ef0d38fc9"

          git fetch origin "$target"
          actual="$(git rev-parse "origin/$target")"
          if [ "$actual" != "$expected" ]; then
            echo "Refusing promotion: $target moved from $expected to $actual"
            exit 1
          fi

          current="$(git rev-parse HEAD)"
          if [ "$current" != "$candidate" ]; then
            echo "Refusing promotion: candidate moved from $candidate to $current"
            exit 1
          fi

          git push origin             "$candidate:refs/heads/$target"             --force-with-lease="refs/heads/$target:$expected"
