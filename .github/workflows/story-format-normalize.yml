name: Story Format Normalize

on:
  push:
    branches:
      - feat/story-runtime-foundation
    paths:
      - .github/workflows/story-format-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/story-runtime-foundation
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Normalize changed Dart files
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --diff-filter=ACMR --name-only origin/master...HEAD -- | grep -E '^(lib|test)/.*\.dart$' || true)"
          if [ -n "$files" ]; then
            dart format $files
          fi

      - name: Verify normalized tree
        shell: bash
        run: |
          set -euo pipefail
          dart analyze --fatal-infos lib test
          flutter test

      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/story-format-normalize.yml
          git add lib test
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(story): normalize Dart formatting"
          git push origin HEAD:feat/story-runtime-foundation
