name: Composer V8 Voice Shell Apply

on:
  push:
    branches: [feat/story-runtime-foundation]
    paths:
      - '.github/patches/composer-v8-voice-shell.py'
      - '.github/workflows/composer-v8-voice-shell-apply.yml'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/story-runtime-foundation
          fetch-depth: 0

      - name: Apply guarded v8 voice shell patch
        run: |
          set -euo pipefail
          python3 .github/patches/composer-v8-voice-shell.py
          git diff --check
          grep -q "composer-voice-shell" lib/features/home/composer/composer_voice_shell.dart
          grep -q "voice-ptt-hint" lib/features/home/composer/composer_voice_shell.dart
          grep -q "_voiceReady" lib/features/home/widgets/chat_input_bar.dart
          grep -q "_beginVoicePtt" lib/features/home/widgets/chat_input_bar.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format affected files
        run: |
          dart format \
            lib/features/home/composer/composer_voice_shell.dart \
            lib/features/home/widgets/chat_input_bar.dart \
            test/features/home/widgets/chat_input_bar_asr_test.dart

      - name: Analyze voice shell
        run: |
          dart analyze --fatal-infos \
            lib/features/home/composer/composer_voice_shell.dart \
            lib/features/home/widgets/chat_input_bar.dart \
            test/features/home/widgets/chat_input_bar_asr_test.dart

      - name: Run voice and Composer regressions
        run: |
          flutter test --concurrency=1 --reporter expanded \
            test/features/home/widgets/chat_input_bar_asr_test.dart \
            test/features/home/widgets/chat_input_bar_mobile_composer_test.dart \
            test/features/home/widgets/chat_input_bar_queue_test.dart \
            test/features/home/widgets/chat_input_bar_conversation_switch_send_test.dart \
            test/features/home/composer/composer_reasoning_level_test.dart \
            test/features/home/composer/composer_reasoning_popover_test.dart

      - name: Commit verified voice shell
        run: |
          set -euo pipefail
          rm -f .github/patches/composer-v8-voice-shell.py
          rm -f .github/workflows/composer-v8-voice-shell-apply.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No verified changes to commit.'
            exit 0
          fi
          git config user.name 'Axymorrsen'
          git config user.email 'Axymosen@outlook.com'
          git commit -m 'feat(composer): match v8 voice shell'
          git push origin HEAD:feat/story-runtime-foundation
