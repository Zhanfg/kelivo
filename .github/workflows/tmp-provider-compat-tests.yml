name: Temporary Provider Compatibility Tests

on:
  push:
    branches:
      - feat/provider-compat-opencode-free

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-compat-opencode-free
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run provider compatibility tests
        run: |
          flutter test \
            test/core/services/auth/provider_oauth_adapter_test.dart \
            test/core/services/api/providers/openai/openai_protocol_compat_test.dart
