name: Temporary FreeBuff Targeted Tests

permissions:
  contents: read

on:
  push:
    branches:
      - feat/provider-compat-opencode-free

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-compat-opencode-free
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check FreeBuff files
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/core/database/business_settings_router.dart \
            lib/core/services/auth/provider_oauth_service.dart \
            test/core/services/auth/provider_oauth_service_test.dart
      - name: FreeBuff targeted tests
        run: |
          flutter test \
            test/core/services/auth/provider_oauth_adapter_test.dart \
            test/core/services/auth/provider_oauth_service_test.dart \
            test/core/services/api/providers/openai/openai_protocol_compat_test.dart
