name: Reconcile Official Upstream (Guarded)

on:
  push:
    branches:
      - sync/upstream-full-20261024
    paths:
      - .github/workflows/reconcile-official-upstream.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-reconcile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.repository == 'Zhanfg/kelivo'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated integration candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch official upstream without modifying main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add official https://github.com/Chevey339/kelivo.git
          git fetch --no-tags official master
          mkdir -p build/upstream-integration
          TARGET="199647a5d718ed47783dde405007e4c080efdec5"
          git cat-file -e "$TARGET^{commit}"
          git merge-base --is-ancestor "$TARGET" official/master
          printf "Fork candidate: %s\nUpstream target: %s\n" "$(git rev-parse HEAD)" "$TARGET" > build/upstream-integration/baselines.txt
          git rev-list --left-right --count "HEAD...$TARGET" > build/upstream-integration/ahead-behind.txt

      - name: Integrate full upstream or verified standalone fixes
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          TARGET="199647a5d718ed47783dde405007e4c080efdec5"
          if git merge --no-commit --no-ff -s ort -X ours "$TARGET" > build/upstream-integration/merge.log 2>&1; then
            printf '%s\n' "full upstream merge candidate staged; verification required" > build/upstream-integration/status.txt
            git diff --cached --name-only > build/upstream-integration/changed-paths.txt
            git diff --cached --check
            git commit -m "merge(upstream): reconcile official Kelivo through 2026-10-24"
          else
            printf '%s\n' "full merge has unresolved conflicts; attempt isolated patches only" > build/upstream-integration/status.txt
            git diff --name-only --diff-filter=U > build/upstream-integration/unresolved-paths.txt || true
            git merge --abort 2>/dev/null || true
            ported=0
            for sha in \
              0169e760c0c369eaebfc1c55539f113a16992a25 \
              9969ec9f9c6f5b548bfb1801e84ef53b1133b7ef \
              38f75ba9b8bc5892afcac299c4aaa3b650fc0969
            do
              if git cherry-pick -x -X ours "$sha" > build/upstream-integration/cherry-last.log 2>&1; then
                echo "$sha PORTED" >> build/upstream-integration/cherry-status.txt
                ported=$((ported + 1))
              else
                git cherry-pick --abort 2>/dev/null || true
                echo "$sha DEFERRED" >> build/upstream-integration/cherry-status.txt
                cat build/upstream-integration/cherry-last.log >> build/upstream-integration/cherry-errors.txt
              fi
            done
            if [ "$ported" -eq 0 ]; then
              echo "No upstream commit integrated safely; branch remains unchanged" >&2
              exit 1
            fi
          fi
          # Preserve the product layers explicitly; CI alone is not a UX acceptance test.
          test -f lib/features/agent/services/agent_task_runner.dart
          test -f lib/features/agent/services/agent_runtime_bootstrap.dart
          test -d lib/features/story
          test -d lib/features/chat
          test -f assets/agent_runtime/kelivo-control.ts
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare Flutter verification
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Analyze and test full integrated candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib/secrets
          printf "const String siliconflowFallbackKey = '';\n" > lib/secrets/fallback.dart
          flutter pub get
          flutter gen-l10n
          dart analyze --fatal-infos lib test integration_test
          flutter test test/features/agent
          flutter test test/features/story
          # Four test shards use the repository's established CI test runner.
          for shard in 0 1 2 3; do
            SHARD="$shard" SHARD_COUNT=4 bash .github/scripts/run_test_shard.sh
          done

      - name: Publish only tested candidate to isolated branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin HEAD:refs/heads/sync/upstream-full-20261024

      - name: Publish diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kelivo-upstream-merge-diagnostics
          path: build/upstream-integration/
          if-no-files-found: warn
          retention-days: 14
