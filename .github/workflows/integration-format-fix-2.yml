name: Integration Format Fix 2

on:
  push:
    branches:
      - test/story-agent-android-20260921
    paths:
      - ".github/workflows/integration-format-fix-2.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/story-agent-android-20260921
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Format files
        run: |
          dart format             lib/features/home/pages/home_page.dart             lib/features/story_runtime/context/story_context_resource_compiler.dart             lib/features/story_runtime/ui/story_continuity_page.dart
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/features/home/pages/home_page.dart             lib/features/story_runtime/context/story_context_resource_compiler.dart             lib/features/story_runtime/ui/story_continuity_page.dart
          git commit -m "style: format analyzer fixes"
          git push origin HEAD:test/story-agent-android-20260921
