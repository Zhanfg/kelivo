name: Composer Native Phase 3C Voice Recovery Apply

on:
  push:
    branches: [feat/story-runtime-foundation]
    paths:
      - '.github/patches/composer-phase3c-voice-recovery.py'
      - '.github/workflows/composer-native-phase3c-voice-recovery-apply.yml'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/story-runtime-foundation
          fetch-depth: 0

      - name: Apply guarded unavailable-ASR recovery integration
        run: |
          set -euo pipefail
          python3 .github/patches/composer-phase3c-voice-recovery.py
          git diff --check

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format affected Dart files
        run: |
          dart format \
            lib/features/home/widgets/chat_input_bar.dart \
            test/features/home/widgets/chat_input_bar_asr_test.dart

      - name: Analyze voice recovery surface
        run: |
          dart analyze --fatal-infos \
            lib/features/home/widgets/chat_input_bar.dart \
            test/features/home/widgets/chat_input_bar_asr_test.dart

      - name: Run voice and Composer regressions
        run: |
          flutter test --concurrency=1 --reporter expanded \
            test/core/providers/asr_provider_test.dart \
            test/features/home/widgets/chat_input_bar_asr_test.dart \
            test/features/home/widgets/chat_input_bar_mobile_composer_test.dart \
            test/features/home/composer/composer_reasoning_level_test.dart \
            test/features/home/composer/composer_reasoning_popover_test.dart \
            test/features/home/widgets/chat_input_bar_queue_test.dart \
            test/features/home/widgets/chat_input_bar_conversation_switch_send_test.dart

      - name: Commit verified unavailable-ASR recovery integration
        run: |
          set -euo pipefail
          rm -f .github/patches/composer-phase3c-voice-recovery.py
          rm -f .github/workflows/composer-native-phase3c-voice-recovery-apply.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No verified changes to commit.'
            exit 0
          fi
          git config user.name 'Axymorrsen'
          git config user.email 'Axymosen@outlook.com'
          git commit -m 'fix(composer): keep voice recovery accessible'
          git push origin HEAD:feat/story-runtime-foundation
