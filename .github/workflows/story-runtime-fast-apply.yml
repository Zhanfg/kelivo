name: Story Skills Integration Apply

on:
  push:
    branches:
      - feat/story-runtime-foundation
    paths:
      - .github/workflows/story-runtime-fast-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/story-runtime-foundation
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Apply integration patch
        run: python3 .github/scripts/apply_story_skill_integration.py

      - name: Format and diff check
        run: |
          dart format \
            lib/features/story_runtime/skills/story_skill_activation_policy.dart \
            lib/features/story_runtime/skills/story_skill_package_store.dart \
            lib/features/story_runtime/skills/story_skill_github_source.dart \
            lib/features/story_runtime/orchestration/story_mvp_prompt_service.dart \
            lib/features/story_runtime/state/story_runtime_store.dart \
            lib/features/story_runtime/ui/story_studio_page.dart \
            test/story_skill_system_test.dart
          git diff --check

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze --fatal-infos lib test

      - name: Test Skill system
        run: |
          flutter test \
            test/story_skill_system_test.dart \
            test/story_skill_package_test.dart

      - name: Commit verified integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/story-runtime-fast-apply.yml
          rm -f .github/scripts/apply_story_skill_integration.py
          git add \
            lib/features/story_runtime/skills/story_skill_activation_policy.dart \
            lib/features/story_runtime/skills/story_skill_package_store.dart \
            lib/features/story_runtime/skills/story_skill_github_source.dart \
            lib/features/story_runtime/orchestration/story_mvp_prompt_service.dart \
            lib/features/story_runtime/state/story_runtime_store.dart \
            lib/features/story_runtime/ui/story_studio_page.dart \
            test/story_skill_system_test.dart
          git add -u \
            .github/workflows/story-runtime-fast-apply.yml \
            .github/scripts/apply_story_skill_integration.py
          git commit -m "feat(skills): unify built-ins and GitHub management"
          git push origin HEAD:feat/story-runtime-foundation