name: Story Continuity Controls

on:
  push:
    branches:
      - feat/story-continuity-controls-20260920

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format continuity files
        run: |
          dart format             lib/features/story_runtime/ui/story_continuity_page.dart             lib/features/story_runtime/ui/story_mode_runtime_page.dart

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "Kelivo Story Continuity"
          git config user.email "actions@users.noreply.github.com"
          git add             lib/features/story_runtime/ui/story_continuity_page.dart             lib/features/story_runtime/ui/story_mode_runtime_page.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(story): format continuity controls"
            git push origin HEAD:refs/heads/feat/story-continuity-controls-20260920
          fi

      - run: dart analyze --fatal-infos lib test integration_test

      - name: Story continuity regression
        run: |
          flutter test --concurrency=2             test/story_world_tree_coordinator_test.dart             test/story_world_tree_models_test.dart             test/story_worldline_memory_test.dart             test/story_runtime_foundation_test.dart
