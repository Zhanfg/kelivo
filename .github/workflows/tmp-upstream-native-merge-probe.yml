name: Upstream Native Merge Candidate V2

on:
  push:
    branches:
      - probe/upstream-native-merge-20260920

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original Story head
        uses: actions/checkout@v4
        with:
          ref: backup/story-runtime-pre-upstream-20260920
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Merge upstream preferring upstream conflict hunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kelivo Upstream Sync"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin master sync/upstream-20260920
          git merge --no-ff -X theirs origin/master -m "merge: sync upstream master into story runtime"

          # Reuse reviewed two-sided infrastructure merges.
          git checkout origin/sync/upstream-20260920 -- \
            .github/workflows/pr-check.yml \
            android/app/build.gradle.kts

          # Keep Story-specific dependency/assets while retaining upstream's
          # local flutter_math_fork path and upstream skill assets.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("pubspec.yaml")
          s=p.read_text()

          if "  hashlib: ^2.4.2" not in s:
              s=s.replace("  cryptography: ^2.9.0\n", "  cryptography: ^2.9.0\n  hashlib: ^2.4.2\n")

          story_assets=[
              "    - assets/story_skills/lieflat-less-ai-tone/SKILL.md\n",
              "    - assets/story_skills/lieflat-less-ai-tone/LICENSE\n",
              "    - assets/story_skills/lieflat-less-ai-tone/prompts/10_kelivo_human_writing_core.md\n",
              "    - assets/story_skills/visual-taste-basics/SKILL.md\n",
              "    - assets/story_skills/github-story-serialization/SKILL.md\n",
          ]
          anchor="  assets:\n"
          if anchor in s:
              pos=s.index(anchor)+len(anchor)
              existing=s[pos:]
              missing=[x for x in story_assets if x.strip() not in existing]
              if missing:
                  s=s[:pos]+''.join(missing)+s[pos:]

          p.write_text(s)
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Regenerate localization outputs
        run: flutter gen-l10n

      - name: Commit merged candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(sync): reconcile dependencies and generated localization"
          fi
          git push origin HEAD:refs/heads/sync/upstream-native-candidate-v2-20260920 --force

      - name: Analyze merged tree
        run: dart analyze --fatal-infos lib test integration_test

      - name: Story focused tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test --concurrency=1 \
            test/story_runtime_foundation_test.dart \
            test/story_runtime_state_test.dart \
            test/story_runtime_machine_test.dart \
            test/story_runtime_controller_test.dart \
            test/story_runtime_assembler_test.dart \
            test/story_response_parser_test.dart \
            test/story_prompt_compiler_test.dart \
            test/story_worldline_memory_test.dart \
            test/story_world_tree_models_test.dart \
            test/story_skill_system_test.dart
