name: Upstream Native Merge Candidate

on:
  push:
    branches:
      - probe/upstream-native-merge-20260920

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original Story head
        uses: actions/checkout@v4
        with:
          ref: backup/story-runtime-pre-upstream-20260920
          fetch-depth: 0

      - name: Merge upstream with Story conflict preference
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kelivo Upstream Sync"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin master sync/upstream-20260920
          git merge --no-ff -X ours origin/master -m "merge: sync upstream master into story runtime"

          # Reuse the two already-reviewed hand-merged infrastructure files.
          git checkout origin/sync/upstream-20260920 -- \
            .github/workflows/pr-check.yml \
            android/app/build.gradle.kts

          # Preserve both dependency additions and both asset families.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("pubspec.yaml")
          s=p.read_text()
          if "  hashlib: ^2.4.2" not in s:
              s=s.replace("  cryptography: ^2.9.0\n", "  cryptography: ^2.9.0\n  hashlib: ^2.4.2\n")
          skill="    - assets/skills/skill-creator/\n"
          if skill not in s:
              anchor="    - assets/story_skills/github-story-serialization/SKILL.md\n"
              s=s.replace(anchor, anchor+skill)
          p.write_text(s)
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Regenerate localization outputs
        run: flutter gen-l10n

      - name: Commit generated/fixup changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(sync): reconcile upstream dependencies and generated localization"
          fi
          git push origin HEAD:refs/heads/sync/upstream-native-candidate-20260920 --force

      - name: Analyze merged tree
        run: dart analyze --fatal-infos lib test integration_test
