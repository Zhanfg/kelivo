name: Upstream Native Merge Theirs Candidate

on:
  push:
    branches:
      - probe/upstream-native-merge-20260920

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original Story head
        uses: actions/checkout@v4
        with:
          ref: backup/story-runtime-pre-upstream-20260920
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Merge upstream preferring upstream conflict hunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kelivo Upstream Sync"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin master sync/upstream-20260920
          git merge --no-ff -X theirs origin/master -m "merge: sync upstream master into story runtime (upstream-preferred)"

          # Reuse the reviewed infrastructure merge for Android + CI.
          git checkout origin/sync/upstream-20260920 -- \
            .github/workflows/pr-check.yml \
            android/app/build.gradle.kts

          # Keep Story assets/dependency while retaining upstream additions.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("pubspec.yaml")
          s=p.read_text()
          if "  cryptography: ^2.9.0" not in s:
              s=s.replace("  hashlib: ^2.4.2\n", "  cryptography: ^2.9.0\n  hashlib: ^2.4.2\n")
          story=[
            "    - assets/story_skills/\n",
            "    - assets/story_skills/lieflat-less-ai-tone/SKILL.md\n",
            "    - assets/story_skills/lieflat-less-ai-tone/prompts/10_kelivo_human_writing_core.md\n",
            "    - assets/story_skills/visual-taste-basics/SKILL.md\n",
            "    - assets/story_skills/github-story-serialization/SKILL.md\n",
          ]
          anchor="    - assets/html/mark.html\n"
          if story[0] not in s:
              s=s.replace(anchor, anchor+"".join(story))
          p.write_text(s)
          PY

          # Upstream adapter contains new icons; add Story aliases without replacing it.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("lib/icons/lucide_adapter.dart")
          s=p.read_text()
          marker="\n}"
          aliases="""

  // Story Runtime aliases intentionally resolve to Kelivo's native icon set.
  static const IconData CircleCheck = CheckCircle;
  static const IconData HardDriveDownload = Download;
  static const IconData CircleOff = XCircle;
  static const IconData Users = User;
  static const IconData Cpu = Activity;
  static const IconData Cloud = Network;
"""
          if "static const IconData CircleCheck = CheckCircle;" not in s:
              s=s.rsplit(marker,1)[0]+aliases+marker
          p.write_text(s)
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Regenerate localization outputs
        run: flutter gen-l10n

      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(sync): reconcile upstream-first candidate"
          fi
          git push origin HEAD:refs/heads/sync/upstream-native-theirs-20260920 --force

      - name: Analyze merged tree
        run: dart analyze --fatal-infos lib test integration_test
