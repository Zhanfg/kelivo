name: MCP Source Identity Check

on:
  push:
    branches:
      - fix/mcp-source-identity-20260922
    paths:
      - ".github/workflows/mcp-source-check.yml"
      - "lib/core/services/mcp/**"
      - "lib/features/home/services/tool_approval_service.dart"
      - "lib/features/home/services/tool_handler_service.dart"
      - "lib/features/chat/widgets/chat_message_widget.dart"
      - "lib/utils/mcp_structured_image.dart"
      - "test/utils/mcp_structured_image_test.dart"
      - "test/features/chat/widgets/chat_message_widget_mcp_and_assistant_attachments_test.dart"
  workflow_dispatch:

concurrency:
  group: mcp-source-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: MCP source metadata tests
        run: |
          flutter test \
            test/utils/mcp_structured_image_test.dart \
            test/features/chat/widgets/chat_message_widget_mcp_and_assistant_attachments_test.dart
