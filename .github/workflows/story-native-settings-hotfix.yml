name: Story Native Settings Hotfix

on:
  push:
    branches:
      - feat/story-runtime-foundation
    paths:
      - .github/workflows/story-native-settings-hotfix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/story-runtime-foundation
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Patch source
        run: python3 tool/story_native_settings_patch.py
      - name: Format
        run: dart format lib/features/settings/pages/settings_page.dart lib/features/settings/pages/settings_core_page.dart lib/features/settings/pages/more_page.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: dart analyze --fatal-infos lib test
      - name: Smoke tests
        run: flutter test --concurrency=1 test/story_runtime_foundation_test.dart test/story_skill_system_test.dart
      - name: Commit
        run: |
          git rm .github/workflows/story-native-settings-hotfix.yml tool/story_native_settings_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/settings/pages/settings_page.dart lib/features/settings/pages/settings_core_page.dart lib/features/settings/pages/more_page.dart
          git commit -m 'fix(story): integrate Story controls with native Settings UI'
          git push origin HEAD:feat/story-runtime-foundation
