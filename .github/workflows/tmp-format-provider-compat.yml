name: Temporary Compat Formatter

permissions:
  contents: write

on:
  push:
    branches:
      - feat/provider-compat-opencode-free

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-compat-opencode-free
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Format compatibility files
        run: |
          dart format \
            lib/core/providers/model_provider.dart \
            lib/core/services/api/providers/google_common.dart \
            test/core/services/api/providers/openai/openai_protocol_compat_test.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/core/providers/model_provider.dart \
            lib/core/services/api/providers/google_common.dart \
            test/core/services/api/providers/openai/openai_protocol_compat_test.dart
          git commit -m "style: apply dart format"
          git push origin HEAD:feat/provider-compat-opencode-free
