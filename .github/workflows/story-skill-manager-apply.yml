name: Story Skill Manager Apply

on:
  push:
    branches:
      - feat/story-runtime-foundation
    paths:
      - .github/workflows/story-skill-manager-apply.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/story-runtime-foundation
          fetch-depth: 0

      - name: Apply Skill manager integration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def r(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'anchor missing: {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          github = 'lib/features/story_runtime/skills/story_skill_github_source.dart'
          r(
              github,
              "typedef StorySkillGitHubRootResolver = Future<Directory> Function();\n",
              "typedef StorySkillGitHubRootResolver = Future<Directory> Function();\ntypedef StorySkillGitHubTempResolver = Future<Directory> Function();\n",
          )
          r(
              github,
              "    StorySkillGitHubRootResolver? appDataRootResolver,\n    this.maxDownloadBytes = 128 * 1024 * 1024,\n",
              "    StorySkillGitHubRootResolver? appDataRootResolver,\n    StorySkillGitHubTempResolver? temporaryDirectoryResolver,\n    this.maxDownloadBytes = 128 * 1024 * 1024,\n",
          )
          r(
              github,
              "       _appDataRootResolver =\n           appDataRootResolver ?? AppDirectories.getAppDataDirectory;\n",
              "       _appDataRootResolver =\n           appDataRootResolver ?? AppDirectories.getAppDataDirectory,\n       _temporaryDirectoryResolver =\n           temporaryDirectoryResolver ?? getTemporaryDirectory;\n",
          )
          r(
              github,
              "  final StorySkillGitHubRootResolver _appDataRootResolver;\n  final int maxDownloadBytes;\n",
              "  final StorySkillGitHubRootResolver _appDataRootResolver;\n  final StorySkillGitHubTempResolver _temporaryDirectoryResolver;\n  final int maxDownloadBytes;\n",
          )
          r(
              github,
              "    final temp = await getTemporaryDirectory();\n    final dir = await temp.createTemp('kelivo_github_skill_');\n",
              "    final temp = await _temporaryDirectoryResolver();\n    await temp.create(recursive: true);\n    final dir = await temp.createTemp('kelivo_github_skill_');\n",
          )

          studio = 'lib/features/story_runtime/ui/story_studio_page.dart'
          r(
              studio,
              "import '../skills/story_skill_binding_store.dart';\n",
              "import '../skills/story_skill_binding_store.dart';\nimport '../skills/story_skill_library.dart';\n",
          )
          r(
              studio,
              "import '../state/story_runtime_store.dart';\n",
              "import '../state/story_runtime_store.dart';\nimport 'story_skill_manager_page.dart';\n",
          )
          r(
              studio,
              "  late StorySkillPackageStore _skillPackageStore;\n  late StorySkillPackageImporter _skillImporter;\n  late StorySkillBindingStore _skillBindingStore;\n",
              "  late StorySkillPackageStore _skillPackageStore;\n  late StorySkillPackageImporter _skillImporter;\n  late StorySkillBindingStore _skillBindingStore;\n  late StorySkillLibrary _skillLibrary;\n",
          )
          r(
              studio,
              "  List<StoryInstalledSkillPackage> _skillPackages = const [];\n  List<StorySkillBinding> _skillBindings = const [];\n",
              "  List<StoryInstalledSkillPackage> _skillPackages = const [];\n  List<StorySkillManifest> _skillManifests = const [];\n  List<StorySkillBinding> _skillBindings = const [];\n",
          )
          r(
              studio,
              "    _skillImporter = StorySkillPackageImporter(repository: _skillPackageStore);\n    _skillBindingStore = StorySkillBindingStore(preferences);\n",
              "    _skillImporter = StorySkillPackageImporter(repository: _skillPackageStore);\n    _skillBindingStore = StorySkillBindingStore(preferences);\n    _skillLibrary = StorySkillLibrary(repository: _skillPackageStore);\n",
          )
          r(
              studio,
              "      final packages = await _skillPackageStore.readAll();\n      final session = conversationId == null\n",
              "      final packages = await _skillPackageStore.readAll();\n      final manifests = await _skillLibrary.loadAll();\n      final session = conversationId == null\n",
          )
          r(
              studio,
              "        _skillPackages = packages;\n        _session = session;\n",
              "        _skillPackages = packages;\n        _skillManifests = manifests;\n        _session = session;\n",
          )
          r(
              studio,
              "  bool _isSkillBound(String skillId) =>\n      _skillBindings.any((item) => item.skillId == skillId && item.enabled);\n\n",
              "  bool _isSkillBound(String skillId) {\n    for (final binding in _skillBindings) {\n      if (binding.skillId == skillId) return binding.enabled;\n    }\n    for (final manifest in _skillManifests) {\n      if (manifest.id == skillId) {\n        return manifest.metadata['defaultEnabled'] == true;\n      }\n    }\n    return false;\n  }\n\n",
          )
          old_set = """    if (enabled) {
      await _skillBindingStore.upsert(
        StorySkillBinding(assistantId: assistantId, skillId: skillId),
      );
    } else {
      await _skillBindingStore.remove(
        assistantId: assistantId,
        skillId: skillId,
      );
    }
"""
          new_set = """    await _skillBindingStore.upsert(
      StorySkillBinding(
        assistantId: assistantId,
        skillId: skillId,
        enabled: enabled,
      ),
    );
"""
          r(studio, old_set, new_set)
          r(
              studio,
              "  Future<void> _runBusy(Future<void> Function() action) async {\n",
              "  Future<void> _openSkillManager() async {\n    await Navigator.of(context).push(\n      MaterialPageRoute<void>(\n        builder: (_) => const StorySkillManagerPage(),\n      ),\n    );\n    if (mounted) await _reload();\n  }\n\n  Future<void> _runBusy(Future<void> Function() action) async {\n",
          )
          old_ui = """                Text(
                  '导入 Story Skill ZIP。绑定到当前会话所属 Assistant 后，Manual / Always 类型会进入 Story MVP。',
                  style: theme.textTheme.bodyMedium,
                ),
                const SizedBox(height: 10),
                FilledButton.icon(
                  onPressed: _busy ? null : _importSkill,
                  icon: const Icon(Icons.extension_outlined),
                  label: const Text('导入 Skill ZIP'),
                ),
                if (_skillPackages.isEmpty)
                  const Padding(
                    padding: EdgeInsets.symmetric(vertical: 16),
                    child: Text('还没有安装 Story Skill。'),
                  ),
                for (final package in _skillPackages)
                  SwitchListTile(
                    contentPadding: EdgeInsets.zero,
                    title: Text(package.skillId),
                    subtitle: Text('v${package.version}'),
                    value: _isSkillBound(package.skillId),
                    onChanged: _busy || selectedConversation == null
                        ? null
                        : (value) => _setSkillBound(package.skillId, value),
                  ),
"""
          new_ui = """                Text(
                  '内置、ZIP 与 GitHub Skill 统一在这里绑定到当前 Assistant。默认 Skill 可显式关闭；GitHub 更新不会静默扩大 MCP、工具或内存权限。',
                  style: theme.textTheme.bodyMedium,
                ),
                const SizedBox(height: 10),
                Wrap(
                  spacing: 8,
                  runSpacing: 8,
                  children: [
                    FilledButton.icon(
                      onPressed: _busy ? null : _importSkill,
                      icon: const Icon(Icons.extension_outlined),
                      label: const Text('导入 Skill ZIP'),
                    ),
                    OutlinedButton.icon(
                      onPressed: _busy ? null : _openSkillManager,
                      icon: const Icon(Icons.cloud_sync_outlined),
                      label: const Text('GitHub 安装 / 更新'),
                    ),
                  ],
                ),
                if (_skillManifests.isEmpty)
                  const Padding(
                    padding: EdgeInsets.symmetric(vertical: 16),
                    child: Text('没有可用 Story Skill。'),
                  ),
                for (final skill in _skillManifests)
                  _storySkillTile(skill, selectedConversation != null),
"""
          r(studio, old_ui, new_ui)
          r(
              studio,
              "  Widget _profileCard(StoryReferenceStyleProfile profile) {\n",
              "  Widget _storySkillTile(StorySkillManifest skill, bool canBind) {\n    final builtIn = skill.metadata['builtIn'] == true;\n    final defaultEnabled = skill.metadata['defaultEnabled'] == true;\n    final description = skill.description?.trim();\n    final source = builtIn ? '内置' : '已安装';\n    return SwitchListTile(\n      contentPadding: EdgeInsets.zero,\n      title: Text(skill.name),\n      subtitle: Text(\n        [\n          '$source · v${skill.version}',\n          if (defaultEnabled) '默认启用',\n          if (description != null && description.isNotEmpty) description,\n        ].join(' · '),\n        maxLines: 3,\n        overflow: TextOverflow.ellipsis,\n      ),\n      value: _isSkillBound(skill.id),\n      onChanged: _busy || !canBind\n          ? null\n          : (value) => _setSkillBound(skill.id, value),\n    );\n  }\n\n  Widget _profileCard(StoryReferenceStyleProfile profile) {\n",
          )
          PY

          cat > test/story_skill_github_source_test.dart <<'DART'
          import 'dart:convert';
          import 'dart:io';

          import 'package:archive/archive.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:http/http.dart' as http;
          import 'package:http/testing.dart';

          import 'package:Kelivo/features/story_runtime/skills/story_skill_github_source.dart';
          import 'package:Kelivo/features/story_runtime/skills/story_skill_package_importer.dart';
          import 'package:Kelivo/features/story_runtime/skills/story_skill_package_store.dart';

          void main() {
            test('parses owner/repo and GitHub tree URLs', () {
              final plain = StorySkillGitHubSource.parse('blader/humanizer');
              expect(plain.repositoryKey, 'blader/humanizer');
              expect(plain.ref, isNull);

              final tree = StorySkillGitHubSource.parse(
                'https://github.com/acme/skills/tree/main/writing/humanizer',
              );
              expect(tree.repositoryKey, 'acme/skills');
              expect(tree.ref, 'main');
              expect(tree.subdirectory, 'writing/humanizer');
            });

            test('installs, checks and updates a safe GitHub Skill', () async {
              final root = await Directory.systemTemp.createTemp('kelivo_skill_git_');
              final temp = Directory('${root.path}/tmp');
              addTearDown(() async {
                if (await root.exists()) await root.delete(recursive: true);
              });
              final store = _MemoryPackageStore();
              final importer = StorySkillPackageImporter(
                repository: store,
                appDataRootResolver: () async => root,
              );
              var commit = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';
              final client = MockClient((request) async {
                if (request.url.path == '/repos/acme/humanizer') {
                  return http.Response(jsonEncode({'default_branch': 'main'}), 200);
                }
                if (request.url.path == '/repos/acme/humanizer/commits/main') {
                  return http.Response(jsonEncode({'sha': commit}), 200);
                }
                if (request.url.path == '/repos/acme/humanizer/zipball/$commit') {
                  return http.Response.bytes(_safeRepositoryZip(commit), 200);
                }
                return http.Response('not found', 404);
              });
              final service = StorySkillGitHubService(
                repository: store,
                importer: importer,
                client: client,
                appDataRootResolver: () async => root,
                temporaryDirectoryResolver: () async => temp,
              );
              addTearDown(service.close);

              final first = await service.install(
                repositoryUrl: 'https://github.com/acme/humanizer',
              );
              expect(first.package.isGitHubManaged, isTrue);
              expect(first.package.sourceRepository, 'acme/humanizer');
              expect(first.package.sourceCommitSha, commit);
              expect((await store.readAll()), hasLength(1));
              final installedRoot = Directory(
                '${root.path}/${first.package.relativeRoot}',
              );
              expect(await File('${installedRoot.path}/SKILL.md').exists(), isTrue);
              expect(
                await File('${installedRoot.path}/prompts/core.md').exists(),
                isTrue,
              );
              expect(
                await File('${installedRoot.path}/scripts/run.sh').exists(),
                isFalse,
              );

              commit = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';
              final check = await service.checkForUpdate(first.package);
              expect(check.updateAvailable, isTrue);
              expect(check.latestCommitSha, commit);

              final updated = await service.update(first.package);
              expect(updated.package.sourceCommitSha, commit);
              final all = await store.readAll();
              expect(all, hasLength(1));
              expect(all.single.sourceCommitSha, commit);
            });

            test('rejects GitHub manifests that request privileged capabilities', () async {
              final root = await Directory.systemTemp.createTemp('kelivo_skill_git_priv_');
              final temp = Directory('${root.path}/tmp');
              addTearDown(() async {
                if (await root.exists()) await root.delete(recursive: true);
              });
              final store = _MemoryPackageStore();
              final importer = StorySkillPackageImporter(
                repository: store,
                appDataRootResolver: () async => root,
              );
              const commit = 'cccccccccccccccccccccccccccccccccccccccc';
              final client = MockClient((request) async {
                if (request.url.path == '/repos/acme/danger') {
                  return http.Response(jsonEncode({'default_branch': 'main'}), 200);
                }
                if (request.url.path == '/repos/acme/danger/commits/main') {
                  return http.Response(jsonEncode({'sha': commit}), 200);
                }
                if (request.url.path == '/repos/acme/danger/zipball/$commit') {
                  return http.Response.bytes(_privilegedRepositoryZip(commit), 200);
                }
                return http.Response('not found', 404);
              });
              final service = StorySkillGitHubService(
                repository: store,
                importer: importer,
                client: client,
                appDataRootResolver: () async => root,
                temporaryDirectoryResolver: () async => temp,
              );
              addTearDown(service.close);

              expect(
                () => service.install(repositoryUrl: 'acme/danger'),
                throwsA(
                  isA<StorySkillGitHubException>().having(
                    (error) => error.code,
                    'code',
                    'capabilities_require_local_zip_review',
                  ),
                ),
              );
              expect(await store.readAll(), isEmpty);
            });
          }

          List<int> _safeRepositoryZip(String commit) {
            final root = 'acme-humanizer-${commit.substring(0, 7)}';
            final archive = Archive()
              ..add(
                ArchiveFile.string(
                  '$root/SKILL.md',
                  '---\nname: Humanizer\ndescription: Natural writing\n---\nKeep prose direct.',
                ),
              )
              ..add(
                ArchiveFile.string(
                  '$root/prompts/core.md',
                  'Avoid empty transitions.',
                ),
              )
              ..add(ArchiveFile.string('$root/scripts/run.sh', 'echo unsafe'));
            return ZipEncoder().encodeBytes(archive);
          }

          List<int> _privilegedRepositoryZip(String commit) {
            final root = 'acme-danger-${commit.substring(0, 7)}';
            final archive = Archive()
              ..add(ArchiveFile.string('$root/SKILL.md', 'Danger skill'))
              ..add(
                ArchiveFile.string(
                  '$root/manifest.json',
                  jsonEncode({
                    'id': 'danger',
                    'name': 'Danger',
                    'version': '1',
                    'tools': ['delete_everything'],
                  }),
                ),
              );
            return ZipEncoder().encodeBytes(archive);
          }

          final class _MemoryPackageStore implements StorySkillPackageRepository {
            final List<StoryInstalledSkillPackage> _items = [];

            @override
            Future<List<StoryInstalledSkillPackage>> readAll() async =>
                List.unmodifiable(_items);

            @override
            Future<StoryInstalledSkillPackage?> read(
              String skillId,
              String version,
            ) async {
              for (final item in _items) {
                if (item.skillId == skillId && item.version == version) return item;
              }
              return null;
            }

            @override
            Future<void> upsert(StoryInstalledSkillPackage package) async {
              _items.removeWhere(
                (item) => item.skillId == package.skillId && item.version == package.version,
              );
              _items.add(package);
            }

            @override
            Future<void> remove(String skillId, String version) async {
              _items.removeWhere(
                (item) => item.skillId == skillId && item.version == version,
              );
            }
          }
          DART

          git diff --check

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Resolve dependencies and format
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/features/story_runtime/skills/story_skill_github_source.dart \
            lib/features/story_runtime/ui/story_skill_manager_page.dart \
            lib/features/story_runtime/ui/story_studio_page.dart \
            test/story_skill_github_source_test.dart
          git diff --check

      - name: Analyze Story Skill integration
        run: >-
          dart analyze --fatal-infos
          lib/features/story_runtime/skills
          lib/features/story_runtime/ui/story_skill_manager_page.dart
          lib/features/story_runtime/ui/story_studio_page.dart
          test/story_skill_github_source_test.dart

      - name: Test Story Skills
        run: >-
          flutter test
          test/story_skill_github_source_test.dart
          test/story_skill_package_test.dart
          test/story_skill_system_test.dart

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/story-skill-manager-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/story_runtime/skills/story_skill_github_source.dart \
            lib/features/story_runtime/ui/story_skill_manager_page.dart \
            lib/features/story_runtime/ui/story_studio_page.dart \
            test/story_skill_github_source_test.dart
          git commit -m "feat(skills): finish GitHub install and update UX"
          git push origin HEAD:feat/story-runtime-foundation
