name: Story one-shot source patch

on:
  push:
    branches:
      - feat/story-runtime-foundation
    paths:
      - .github/workflows/story-one-shot-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/story-runtime-foundation
          fetch-depth: 0

      - name: Patch Story native playback and Skill discovery
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          controller = Path('lib/features/home/controllers/home_page_controller.dart')
          text = controller.read_text()
          import_line = "import '../../story_runtime/orchestration/story_native_lifecycle_bridge.dart';"
          playback_import = "import '../../story_runtime/voice/story_voice_playback_service.dart';"
          if playback_import not in text:
              if import_line not in text:
                  raise SystemExit('Story lifecycle import anchor missing')
              text = text.replace(import_line, import_line + '\n' + playback_import, 1)

          old = '''    final selectedService = sp.selectedTtsService;
    if (selectedService != null && selectedService.enabled) {
      var routedService = selectedService;
      try {
        final preferences = _context.read<BusinessPreferences>();
        routedService = await StoryNativeLifecycleBridge(
          preferences,
        ).routeNarrator(message: message, selectedService: selectedService);
      } catch (error) {
        debugPrint('Story narrator routing failed: $error');
      }
      await tts.speakWithNetworkService(routedService, text);
      return;
    }

    await tts.speak(text);'''
          new = '''    try {
      final preferences = _context.read<BusinessPreferences>();
      final bridge = StoryNativeLifecycleBridge(preferences);
      final narrator = await bridge.resolveNarratorAssignment(message);
      if (narrator != null) {
        final voiceContext = await bridge.resolveNarratorContext(message);
        await StoryVoicePlaybackService(
          preferences: preferences,
          ttsProvider: tts,
        ).speakAssignment(
          assignment: narrator,
          text: text,
          context: voiceContext,
        );
        return;
      }
    } catch (error) {
      debugPrint('Story narrator playback failed: $error');
    }

    final selectedService = sp.selectedTtsService;
    if (selectedService != null && selectedService.enabled) {
      await tts.speakWithNetworkService(selectedService, text);
      return;
    }

    await tts.speak(text);'''
          if old not in text:
              if 'Story narrator playback failed:' not in text:
                  raise SystemExit('TTS playback replacement anchor missing')
          else:
              text = text.replace(old, new, 1)
          controller.write_text(text)

          source = Path('lib/features/story_runtime/skills/story_skill_github_source.dart')
          skill = source.read_text()
          call_old = '_selectSkillRoot(relative, source.subdirectory)'
          call_new = '_selectSkillRoot(\n      relative,\n      source.subdirectory,\n      repository: source.repository,\n    )'
          if call_old in skill:
              skill = skill.replace(call_old, call_new, 1)

          pattern = re.compile(
              r"String _selectSkillRoot\(\n.*?\n\}\n\nMap<String, String> _parseFrontmatter",
              re.S,
          )
          replacement = '''String _selectSkillRoot(
  Map<String, ArchiveFile> entries,
  String? requestedSubdirectory, {
  required String repository,
}) {
  final requested = _normalizeSubdirectory(requestedSubdirectory);
  if (requested != null) {
    final path = '$requested/SKILL.md';
    final entry = entries[path];
    if (entry != null && entry.isFile) return requested;
    throw StorySkillGitHubException(
      'skill_subdirectory_missing',
      detail: requested,
    );
  }
  if (entries.containsKey('SKILL.md')) return '';

  final candidates = entries.keys
      .where((path) => path.endsWith('/SKILL.md'))
      .map((path) => path.substring(0, path.length - '/SKILL.md'.length))
      .toList(growable: false);
  if (candidates.isEmpty) {
    throw const StorySkillGitHubException('skill_markdown_missing');
  }

  String slug(String value) => value
      .toLowerCase()
      .replaceAll(RegExp(r'[^a-z0-9]+'), '-')
      .replaceAll(RegExp(r'^-+|-+$'), '');
  final repositorySlug = slug(repository);

  int score(String candidate) {
    final normalized = candidate.replaceAll('\\\\', '/');
    final segments = normalized.split('/').where((item) => item.isNotEmpty).toList();
    final leaf = segments.isEmpty ? normalized : segments.last;
    var value = segments.length * 20;
    if (slug(leaf) == repositorySlug) value -= 1000;
    if (entries.containsKey('$candidate/manifest.json')) value -= 250;
    final lower = normalized.toLowerCase();
    if (lower.startsWith('skills/') ||
        lower.startsWith('.agents/skills/') ||
        lower.startsWith('.claude/skills/') ||
        lower.startsWith('.github/skills/')) {
      value -= 120;
    }
    if (lower.contains('/skills/')) value -= 60;
    return value;
  }

  candidates.sort((a, b) {
    final scoreCompare = score(a).compareTo(score(b));
    if (scoreCompare != 0) return scoreCompare;
    final depthCompare = a.split('/').length.compareTo(b.split('/').length);
    if (depthCompare != 0) return depthCompare;
    return a.compareTo(b);
  });
  return candidates.first;
}

Map<String, String> _parseFrontmatter'''
          skill, count = pattern.subn(replacement, skill, count=1)
          if count != 1:
              if 'required String repository' not in skill:
                  raise SystemExit('Skill root function replacement anchor missing')
          source.write_text(skill)
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/story-one-shot-source-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/home/controllers/home_page_controller.dart \
                  lib/features/story_runtime/skills/story_skill_github_source.dart
          git diff --cached --check
          git commit -m "feat(story): finish native playback and Skill discovery"
          git push origin HEAD:feat/story-runtime-foundation
