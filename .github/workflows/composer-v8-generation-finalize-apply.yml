name: Composer V8 Generation Finalize Apply

on:
  push:
    branches: [feat/story-runtime-foundation]
    paths:
      - '.github/patches/composer-v8-generation-finalize.py'
      - '.github/workflows/composer-v8-generation-finalize-apply.yml'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/story-runtime-foundation
          fetch-depth: 0

      - name: Apply guarded v8 generation finalize patch
        run: |
          set -euo pipefail
          python3 .github/patches/composer-v8-generation-finalize.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/home/widgets/chat_input_bar.dart')
          text = path.read_text(encoding='utf-8')
          old = """class _CompactSendButton extends StatelessWidget {
            const _CompactSendButton({
              super.key,
              required this.enabled,"""
          new = """class _CompactSendButton extends StatelessWidget {
            const _CompactSendButton({
              required this.enabled,"""
          if text.count(old) != 1:
              raise SystemExit(f'compact-send-key: expected 1 match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          ! grep -q 'StoryModeChatChip' lib/features/home/widgets/chat_input_section.dart
          grep -q "composer-generation-actions" lib/features/home/widgets/chat_input_bar.dart
          grep -q "composer-reasoning-button" lib/features/home/widgets/chat_input_bar.dart
          grep -q "pauseStreamSubscription" lib/features/home/controllers/chat_controller.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format affected files
        run: |
          dart format \
            lib/icons/lucide_adapter.dart \
            lib/features/home/controllers/chat_controller.dart \
            lib/features/home/controllers/home_view_model.dart \
            lib/features/home/controllers/home_page_controller.dart \
            lib/features/home/pages/home_page.dart \
            lib/features/home/widgets/chat_input_section.dart \
            lib/features/home/widgets/chat_input_bar.dart \
            test/features/home/controllers/chat_controller_pause_test.dart \
            test/features/home/widgets/chat_input_bar_queue_test.dart

      - name: Analyze generation surface
        run: |
          dart analyze --fatal-infos \
            lib/icons/lucide_adapter.dart \
            lib/features/home/controllers/chat_controller.dart \
            lib/features/home/controllers/home_view_model.dart \
            lib/features/home/controllers/home_page_controller.dart \
            lib/features/home/pages/home_page.dart \
            lib/features/home/widgets/chat_input_section.dart \
            lib/features/home/widgets/chat_input_bar.dart \
            test/features/home/controllers/chat_controller_pause_test.dart \
            test/features/home/widgets/chat_input_bar_queue_test.dart

      - name: Run generation and Composer regressions
        run: |
          flutter test --concurrency=1 --reporter expanded \
            test/features/home/controllers/chat_controller_pause_test.dart \
            test/features/home/widgets/chat_input_bar_queue_test.dart \
            test/features/home/widgets/chat_input_bar_mobile_composer_test.dart \
            test/features/home/widgets/chat_input_bar_asr_test.dart \
            test/features/home/composer/composer_reasoning_level_test.dart \
            test/features/home/composer/composer_reasoning_popover_test.dart \
            test/features/home/widgets/chat_input_bar_conversation_switch_send_test.dart

      - name: Commit verified generation changes
        run: |
          set -euo pipefail
          rm -f .github/patches/composer-v8-generation-finalize.py
          rm -f .github/workflows/composer-v8-generation-finalize-apply.yml
          rm -f .github/patches/composer-v8-phase1-generation.py
          rm -f .github/patches/composer-v8-phase1-generation-fix.py
          rm -f .github/patches/composer-v8-phase1-generation-lint-fix.py
          rm -f .github/workflows/composer-v8-phase1-generation-apply.yml
          rm -f .github/workflows/composer-v8-phase1-generation-fix-apply.yml
          rm -f .github/workflows/composer-v8-phase1-generation-lint-fix-apply.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No verified changes to commit.'
            exit 0
          fi
          git config user.name 'Axymorrsen'
          git config user.email 'Axymosen@outlook.com'
          git commit -m 'feat(composer): finalize v8 generation controls'
          git push origin HEAD:feat/story-runtime-foundation
