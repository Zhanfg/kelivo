name: Story Regression Fix

on:
  push:
    branches:
      - feat/story-runtime-foundation
    paths:
      - .github/workflows/story-regression-fix.yml

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/story-runtime-foundation
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply compatibility fixes
        run: python3 .github/scripts/story_regression_fix.py

      - name: Format changed Dart files
        run: dart format lib/features/home/services/message_generation_service.dart test/core/services/backup/restore_bundle_mover_test.dart test/core/services/backup/restore_receipt_test.dart test/core/services/backup/restore_previous_builder_test.dart test/core/services/backup/restore_previous_plan_test.dart

      - name: Analyze
        run: dart analyze --fatal-infos lib test

      - name: Verify regressions
        run: flutter test --concurrency=1 test/core/services/backup/restore_bundle_mover_test.dart test/core/services/backup/restore_receipt_test.dart test/core/services/backup/restore_previous_builder_test.dart test/core/services/backup/restore_previous_plan_test.dart test/features/home/controllers/chat_send_race_test.dart

      - name: Verify Story core
        run: flutter test --concurrency=1 test/story_runtime_foundation_test.dart test/story_runtime_controller_test.dart test/story_prompt_compiler_test.dart test/story_runtime_assembler_test.dart test/story_skill_system_test.dart

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/home/services/message_generation_service.dart test/core/services/backup/restore_bundle_mover_test.dart test/core/services/backup/restore_receipt_test.dart test/core/services/backup/restore_previous_builder_test.dart test/core/services/backup/restore_previous_plan_test.dart
          if git diff --cached --quiet; then
            echo 'No verified changes to commit.'
            exit 0
          fi
          git commit -m 'fix(story): preserve plain chat and backup fixtures'
          git push origin HEAD:feat/story-runtime-foundation

# structural-fix-run
