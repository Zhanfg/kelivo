name: Story Merge Audit Fix

on:
  push:
    branches:
      - probe/upstream-native-merge-20260920

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated final candidate
        uses: actions/checkout@v4
        with:
          ref: sync/upstream-native-final-20260920
          fetch-depth: 0

      - name: Apply audited Story unions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kelivo Story Merge Audit"
          git config user.email "actions@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def line_start(text, pos):
              return text.rfind("\n", 0, pos) + 1

          def add_asset_root(path):
              s = read(path)
              if "'story_skills'," in s:
                  return
              anchor = "    'skills',\n"
              if anchor not in s:
                  raise SystemExit(f"{path}: skills root anchor missing")
              write(path, s.replace(anchor, anchor + "    'story_skills',\n", 1))

          for p in [
              "lib/core/services/backup/data_sync.dart",
              "lib/core/services/backup/restore_bundle_staging.dart",
              "lib/core/services/backup/restore_previous_plan.dart",
          ]:
              add_asset_root(p)

          # Reserve both upstream Workspace tool names and Story-owned
          # serialization tool names.
          p = "lib/features/home/services/built_in_tool_names.dart"
          s = read(p)
          story_import = "import '../../story_runtime/serialization/story_serialization_tools.dart';\n"
          if story_import not in s:
              anchor = "import '../../../core/services/workspace/workspace_tools_service.dart';\n"
              if anchor not in s:
                  raise SystemExit("built_in_tool_names: workspace import missing")
              s = s.replace(anchor, anchor + story_import, 1)
          if "...StorySerializationTools.names," not in s:
              anchor = "    ...WorkspaceToolsService.toolNames,\n"
              if anchor not in s:
                  raise SystemExit("built_in_tool_names: workspace names missing")
              s = s.replace(anchor, anchor + "    ...StorySerializationTools.names,\n", 1)
          write(p, s)

          # Add Story-native entries to the new upstream SettingsPage instead
          # of reverting to the old wrapper/copy.
          p = "lib/features/settings/pages/settings_page.dart"
          s = read(p)
          base_import = "import '../../world_book/pages/world_book_page.dart';\n"
          if base_import not in s:
              raise SystemExit("settings_page: world-book import missing")
          imports = [
              "import '../../story_runtime/ui/story_reference_library_page.dart';\n",
              "import '../../story_runtime/ui/story_skill_manager_page.dart';\n",
              "import '../../story_runtime/ui/story_studio_page.dart';\n",
          ]
          insert_after = base_import
          for imp in imports:
              if imp not in s:
                  s = s.replace(insert_after, insert_after + imp, 1)
              insert_after = imp

          if "final storyModeLabel =" not in s:
              anchor = "    final settings = context.watch<SettingsProvider>();\n"
              if anchor not in s:
                  raise SystemExit("settings_page: settings provider anchor missing")
              labels = (
                  "    final languageCode = Localizations.localeOf(context).languageCode;\n"
                  "    final referenceTextsLabel = languageCode == 'zh'\n"
                  "        ? '参考文本'\n"
                  "        : 'Reference Texts';\n"
                  "    final storySkillsLabel = languageCode == 'zh' ? '故事技能' : 'Story Skills';\n"
                  "    final storyModeLabel = languageCode == 'zh' ? '故事模式' : 'Story Mode';\n"
              )
              s = s.replace(anchor, anchor + labels, 1)

          if "StoryReferenceLibraryPage()" not in s:
              memory = s.index("label: l10n.settingsPageMemory,")
              quick = s.index("label: l10n.settingsPageQuickPhrase,", memory)
              quick_row = s.rfind("_iosNavRow(", memory, quick)
              if quick_row < 0:
                  raise SystemExit("settings_page: quick phrase row not found")
              insert = line_start(s, quick_row)
              indent = s[insert:quick_row]
              rows = f"""{{indent}}_iosNavRow(
          {{indent}}  context,
          {{indent}}  icon: Lucide.BookOpenText,
          {{indent}}  label: referenceTextsLabel,
          {{indent}}  onTap: () {{
          {{indent}}    Navigator.of(context).push(
          {{indent}}      MaterialPageRoute(
          {{indent}}        builder: (_) => const StoryReferenceLibraryPage(),
          {{indent}}      ),
          {{indent}}    );
          {{indent}}  }},
          {{indent}}),
          {{indent}}_iosDivider(context),
          {{indent}}_iosNavRow(
          {{indent}}  context,
          {{indent}}  icon: Lucide.Shapes,
          {{indent}}  label: storySkillsLabel,
          {{indent}}  onTap: () {{
          {{indent}}    Navigator.of(context).push(
          {{indent}}      MaterialPageRoute(
          {{indent}}        builder: (_) => const StorySkillManagerPage(),
          {{indent}}      ),
          {{indent}}    );
          {{indent}}  }},
          {{indent}}),
          {{indent}}_iosDivider(context),
          {{indent}}_iosNavRow(
          {{indent}}  context,
          {{indent}}  icon: Lucide.Compass,
          {{indent}}  label: storyModeLabel,
          {{indent}}  onTap: () {{
          {{indent}}    Navigator.of(context).push(
          {{indent}}      MaterialPageRoute(builder: (_) => const StoryStudioPage()),
          {{indent}}    );
          {{indent}}  }},
          {{indent}}),
          {{indent}}_iosDivider(context),
          """
              s = s[:insert] + rows + s[insert:]
          write(p, s)

          # Explicit root-state fixtures must remain complete after extending
          # RestorePreviousAssetsPlan.rootNames.
          for p in [
              "test/core/services/backup/restore_previous_builder_test.dart",
              "test/core/services/backup/restore_previous_plan_test.dart",
          ]:
              s = read(p)
              if "'story_skills': RestorePreviousAssetRootState." not in s:
                  pattern = re.compile(
                      r"^(\s*)'skills': (RestorePreviousAssetRootState\.[a-z]+),$",
                      re.MULTILINE,
                  )
                  def repl(match):
                      indent, state = match.groups()
                      return (
                          f"{indent}'skills': {state},\n"
                          f"{indent}'story_skills': {state},"
                      )
                  s, count = pattern.subn(repl, s)
                  if count == 0:
                      raise SystemExit(f"{p}: no explicit skills root fixture found")
                  write(p, s)

          print("Audited Story unions applied")
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Format audited files
        run: |
          dart format             lib/core/services/backup/data_sync.dart             lib/core/services/backup/restore_bundle_staging.dart             lib/core/services/backup/restore_previous_plan.dart             lib/features/home/services/built_in_tool_names.dart             lib/features/settings/pages/settings_page.dart             test/core/services/backup/restore_previous_builder_test.dart             test/core/services/backup/restore_previous_plan_test.dart

      - name: Commit audited candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(sync): preserve Story backup tools and settings"
            git push origin HEAD:refs/heads/sync/upstream-native-final-20260920 --force
          else
            echo "Audited candidate already up to date."
          fi

      - name: Analyze
        run: dart analyze --fatal-infos lib test integration_test

      - name: Backup and Story regression
        shell: bash
        run: |
          set -euo pipefail
          flutter test --concurrency=2             test/story_*_test.dart             test/features/story_runtime             test/encrypted_full_backup_test.dart             test/core/services/backup/restore_bundle_mover_test.dart             test/core/services/backup/restore_previous_builder_test.dart             test/core/services/backup/restore_previous_plan_test.dart             test/core/services/backup/restore_receipt_test.dart             test/features/chat/widgets/bottom_tools_sheet_test.dart             test/features/home/widgets/chat_input_bar_queue_test.dart             test/features/home/widgets/chat_input_bar_mobile_composer_test.dart             test/core/services/tts/local_tts_test.dart
