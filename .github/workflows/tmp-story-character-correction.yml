name: Story Character Correction

on:
  push:
    branches:
      - feat/story-character-correction-20260920

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format character correction
        run: dart format lib/features/story_runtime/ui/story_character_manager_page.dart
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "Kelivo Story Character"
          git config user.email "actions@users.noreply.github.com"
          git add lib/features/story_runtime/ui/story_character_manager_page.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(story): format character correction"
            git push origin HEAD:refs/heads/feat/story-character-correction-20260920
          fi
      - run: dart analyze --fatal-infos lib test integration_test
      - run: flutter test --concurrency=2 test/story_runtime_foundation_test.dart test/story_voice_routing_test.dart
