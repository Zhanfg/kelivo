name: Story Character Integration

on:
  push:
    branches:
      - feat/story-character-correction-integrated-20260920

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/features/story_runtime/ui/story_character_manager_page.dart
      - run: dart analyze --fatal-infos lib test integration_test
      - name: Character regression
        run: |
          flutter test --concurrency=2             test/story_runtime_foundation_test.dart             test/story_voice_routing_test.dart             test/story_runtime_state_test.dart
