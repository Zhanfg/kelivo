name: Agent format sweep

on:
  push:
    branches:
      - feat/agent-runtime-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-runtime-foundation
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Format changed Dart files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          mapfile -t files < <(git diff --diff-filter=ACMR --name-only origin/master...HEAD -- | grep -E '^(lib|test|integration_test)/.*\.dart$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            exit 0
          fi
          dart format "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "style(agent): apply dart format sweep"
          git push origin HEAD:feat/agent-runtime-foundation
