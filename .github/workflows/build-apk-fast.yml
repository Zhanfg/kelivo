name: Fast Test APK

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version'
        required: false
        default: '3.44.9'
        type: string
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/build-apk-fast.yml
      - android/**
      - tool/**
      - assets/agent_runtime/**
      - pubspec.yaml
      - dependencies/**
      - lib/**
  push:
    branches:
      - master
      - main
    paths:
      - .github/workflows/build-apk-fast.yml
      - lib/**
      - test/**
      - integration_test/**
      - android/**
      - assets/**
      - tool/**
      - pubspec.yaml
      - dependencies/**

permissions:
  contents: read

concurrency:
  group: fast-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    name: Build fast ARM64 test APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version || '3.44.9' }}
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml', 'dependencies/**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-android-arm64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-arm64-
            ${{ runner.os }}-cargo-

      - name: Cache arm64 PRoot JNI
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs/arm64-v8a
          key: ${{ runner.os }}-proot-jni-arm64-${{ hashFiles('tool/fetch_proot.sh', 'tool/restore_pinned_proot.py', 'tool/proot_checksums.txt') }}

      - name: Inject fallback stub
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '';
          EOF

      - name: Prepare embedded Agent runtime
        shell: bash
        run: bash tool/prepare_agent_runtime.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Refresh Flutter Android plugin config
        run: flutter build apk --config-only --target-platform android-arm64

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Preinstall Rust Android target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable aarch64-linux-android

      # NDK 28.2 is not reliably preinstalled on ubuntu-latest. Installing
      # it implicitly inside Gradle occasionally downloads a corrupt ZIP, so
      # validate it in a retryable step before starting the expensive build.
      - name: Install and verify Android NDK (retryable)
        shell: bash
        run: |
          set -euo pipefail
          ndk_version='28.2.13676358'
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdkmanager="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager" ]]; then
            sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$sdkmanager"
          for attempt in 1 2 3; do
            if "$sdkmanager" --sdk_root="$sdk_root" --install "ndk;$ndk_version" && \\
               test -x "$sdk_root/ndk/$ndk_version/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" && \\
               grep -q "Pkg.Revision = $ndk_version" "$sdk_root/ndk/$ndk_version/source.properties"; then
              echo "Verified NDK $ndk_version (attempt $attempt)"
              break
            fi
            echo "NDK install invalid; clearing only this NDK and retrying ($attempt/3)"
            rm -rf "$sdk_root/ndk/$ndk_version"
            if [[ "$attempt" == 3 ]]; then
              echo 'Failed to install a valid Android NDK after 3 attempts' >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Build fast ARM64 debug APK
        env:
          KELIVO_ANDROID_ABIS: arm64-v8a
        run: |
          flutter build apk \
            --debug \
            --no-pub \
            --target-platform android-arm64

      - name: Package test APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          OUT="dist/Kelivo_Fast_Test_${SHORT_SHA}_arm64.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > dist/SHA256SUMS.txt
          ls -lh "$OUT"

      - name: Upload fast test APK
        uses: actions/upload-artifact@v4
        with:
          name: Kelivo-Fast-Test-arm64
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
