name: Integration Format Fix

on:
  push:
    branches:
      - test/story-agent-android-20260921
    paths:
      - ".github/workflows/integration-format-fix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/story-agent-android-20260921
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Format exact failing files
        shell: bash
        run: |
          set -euo pipefail
          dart format             lib/features/agent/services/agent_model_bridge.dart             lib/features/home/pages/home_desktop_layout.dart             lib/features/home/pages/home_mobile_layout.dart             lib/features/home/pages/home_page.dart             lib/features/story_runtime/context/story_context_resource_compiler.dart             lib/features/story_runtime/context/story_context_resource_store.dart             lib/features/story_runtime/context/story_context_resources.dart             test/story_context_resources_test.dart
      - name: Commit formatted files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/features/agent/services/agent_model_bridge.dart             lib/features/home/pages/home_desktop_layout.dart             lib/features/home/pages/home_mobile_layout.dart             lib/features/home/pages/home_page.dart             lib/features/story_runtime/context/story_context_resource_compiler.dart             lib/features/story_runtime/context/story_context_resource_store.dart             lib/features/story_runtime/context/story_context_resources.dart             test/story_context_resources_test.dart
          git commit -m "style: format Story Agent integration"
          git push origin HEAD:test/story-agent-android-20260921
