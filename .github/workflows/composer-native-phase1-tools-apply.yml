name: Composer Native Phase 1 Tools Apply

on:
  push:
    branches: [feat/story-runtime-foundation]
    paths:
      - '.github/patches/composer-phase1-tools.py'
      - '.github/workflows/composer-native-phase1-tools-apply.yml'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/story-runtime-foundation
          fetch-depth: 0

      - name: Apply guarded secondary-tool migration
        run: |
          set -euo pipefail
          python3 .github/patches/composer-phase1-tools.py
          git diff --check

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/chat/widgets/bottom_tools_sheet.dart \
            lib/features/home/pages/home_page.dart

      - name: Analyze affected interaction surface
        run: |
          dart analyze --fatal-infos \
            lib/features/chat/widgets/bottom_tools_sheet.dart \
            lib/features/home/pages/home_page.dart \
            lib/features/home/widgets/chat_input_bar.dart \
            lib/features/home/composer

      - name: Run Composer regressions
        run: |
          flutter test --concurrency=1 --reporter expanded \
            test/features/home/widgets/chat_input_bar_mobile_composer_test.dart \
            test/features/home/widgets/chat_input_bar_asr_test.dart \
            test/features/home/widgets/chat_input_bar_queue_test.dart \
            test/features/home/widgets/chat_input_bar_conversation_switch_send_test.dart

      - name: Commit verified secondary-tool migration
        run: |
          set -euo pipefail
          rm -f \
            .github/patches/composer-phase1-tools.py \
            .github/workflows/composer-native-phase1-tools-apply.yml
          rmdir .github/patches 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name 'Axymorrsen'
          git config user.email 'Axymosen@outlook.com'
          git commit -m 'refactor(composer): preserve secondary tools in compact layout'
          git push origin HEAD:feat/story-runtime-foundation
