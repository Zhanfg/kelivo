name: Temporary Dart format fix
on:
  push:
    branches:
      - feat/agent-runtime-foundation
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - run: flutter pub get
      - name: Format exact CI offender
        run: dart format lib/features/agent/providers/agent_interaction_broker.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/agent/providers/agent_interaction_broker.dart
          git commit -m "style(agent): apply Dart formatter"
          git push origin HEAD:${{ github.ref_name }}
