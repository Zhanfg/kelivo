name: Story MCP Integration

on:
  push:
    branches:
      - feat/story-mcp-profile-integrated-20260920

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed             lib/features/story_runtime/mcp/story_mcp_profile_store.dart             lib/features/story_runtime/ui/story_mcp_profile_page.dart             lib/features/story_runtime/ui/story_mode_runtime_page.dart             test/story_mcp_profile_store_test.dart
      - run: dart analyze --fatal-infos lib test integration_test
      - name: Story MCP and character regression
        run: |
          flutter test --concurrency=2             test/story_mcp_profile_store_test.dart             test/story_runtime_foundation_test.dart             test/story_skill_system_test.dart             test/story_voice_routing_test.dart             test/story_runtime_state_test.dart
