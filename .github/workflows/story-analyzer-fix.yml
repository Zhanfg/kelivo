name: Story Analyzer Cleanup

on:
  push:
    branches:
      - feat/story-runtime-foundation
    paths:
      - .github/workflows/story-analyzer-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/story-runtime-foundation
          fetch-depth: 0

      - name: Apply analyzer fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor missing: {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          for path in [
              'lib/features/story_runtime/skills/story_skill_package_store.dart',
              'lib/features/story_runtime/state/story_runtime_store.dart',
          ]:
              p = Path(path)
              text = p.read_text()
              text = text.replace("import '../../../core/database/business_preferences.dart';\n", '', 1)
              p.write_text(text)

          p = Path('lib/features/story_runtime/skills/story_skill_github_source.dart')
          text = p.read_text()
          marker = "import 'dart:convert';\n"
          if '// ignore_for_file: prefer_initializing_formals' not in text:
              text = text.replace(
                  marker,
                  '// ignore_for_file: prefer_initializing_formals\n\n' + marker,
                  1,
              )
          p.write_text(text)

          manager = 'lib/features/story_runtime/ui/story_skill_manager_page.dart'
          replace(manager, '                  value: selectedAssistantId,\n', '                  initialValue: selectedAssistantId,\n')
          replace(
              manager,
              '    final managed = package?.isGitHubManaged == true;\n',
              '    final gitHubPackage = package != null && package.isGitHubManaged ? package : null;\n',
          )
          replace(
              manager,
              '    final description = manifest.description?.trim();\n',
              '    final description = manifest.description?.trim();\n    final sourceRepository = gitHubPackage?.sourceRepository;\n',
          )
          replace(
              manager,
              "      builtIn\n          ? '内置'\n          : managed\n              ? 'GitHub'\n              : '本地安装',\n",
              "      builtIn\n          ? '内置'\n          : gitHubPackage != null\n              ? 'GitHub'\n              : '本地安装',\n",
          )
          replace(
              manager,
              "      if (managed && package?.sourceRepository != null) package!.sourceRepository!,\n",
              "      if (sourceRepository != null) sourceRepository,\n",
          )
          replace(manager, '            if (managed) ...[\n', '            if (gitHubPackage != null) ...[\n')
          replace(manager, 'package!.sourceCommitSha!', 'gitHubPackage.sourceCommitSha!')
          replace(manager, '() => _checkOne(package)', '() => _checkOne(gitHubPackage)')
          replace(manager, '() => _updateOne(package)', '() => _updateOne(gitHubPackage)')

          studio = 'lib/features/story_runtime/ui/story_studio_page.dart'
          replace(studio, '                  value: _selectedConversationId,\n', '                  initialValue: _selectedConversationId,\n')
          replace(studio, '                    value: _session!.agencyMode,\n', '                    initialValue: _session!.agencyMode,\n')
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/features/story_runtime/skills/story_skill_package_store.dart \
            lib/features/story_runtime/state/story_runtime_store.dart \
            lib/features/story_runtime/skills/story_skill_github_source.dart \
            lib/features/story_runtime/ui/story_skill_manager_page.dart \
            lib/features/story_runtime/ui/story_studio_page.dart
          dart analyze --fatal-infos lib test
          flutter test \
            test/story_skill_activation_policy_test.dart \
            test/story_skill_system_test.dart \
            test/story_skill_package_test.dart \
            test/story_mvp_prompt_service_test.dart

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/story-analyzer-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/story_runtime/skills/story_skill_package_store.dart \
            lib/features/story_runtime/state/story_runtime_store.dart \
            lib/features/story_runtime/skills/story_skill_github_source.dart \
            lib/features/story_runtime/ui/story_skill_manager_page.dart \
            lib/features/story_runtime/ui/story_studio_page.dart
          git commit -m "fix(story): clear analyzer issues in publishable MVP"
          git push origin HEAD:feat/story-runtime-foundation
