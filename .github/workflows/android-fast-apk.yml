name: Android Fast APK

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version'
        required: false
        default: '3.44.9'
        type: string

jobs:
  android-arm64:
    name: Android arm64 quick build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build arm64 APK
        run: |
          flutter build apk \
            --release \
            --no-pub \
            --target-platform android-arm64 \
            --split-per-abi \
            --split-debug-info=build/symbols/android

      - name: Report size
        shell: bash
        run: |
          APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*arm64-v8a*release.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          du -h "$APK"

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Kelivo-Android-arm64-fast
          path: build/app/outputs/flutter-apk/*arm64-v8a*release.apk
          if-no-files-found: error

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: Kelivo-Android-arm64-symbols
          path: build/symbols/android
          if-no-files-found: error
