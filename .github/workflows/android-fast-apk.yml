name: Android Fast APK

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version'
        required: false
        default: '3.44.9'
        type: string
  push:
    branches:
      - chore/android-build-size-optimization
    paths:
      - .github/workflows/android-fast-apk.yml
      - android/**
      - tool/fetch_proot.sh
      - tool/proot_checksums.txt
      - pubspec.yaml

concurrency:
  group: android-fast-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    name: Android arm64 quick build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version || '3.44.9' }}
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml', 'dependencies/**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache arm64 PRoot JNI
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs/arm64-v8a
          key: ${{ runner.os }}-proot-jni-arm64-${{ hashFiles('tool/fetch_proot.sh', 'tool/proot_checksums.txt') }}

      - name: Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build arm64 APK
        env:
          KELIVO_ANDROID_ABIS: arm64-v8a
        run: |
          flutter build apk \
            --release \
            --no-pub \
            --target-platform android-arm64 \
            --split-per-abi \
            --split-debug-info=build/symbols/android \
            --analyze-size

      - name: Report size
        shell: bash
        run: |
          APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*arm64-v8a*release.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          du -h "$APK"
          echo "Largest APK entries:"
          unzip -l "$APK" \
            | awk 'NF == 4 && $1 ~ /^[0-9]+$/ {print $1, $4}' \
            | sort -nr \
            | head -n 40 \
            | tee build/android-apk-largest-files.txt

      - name: Collect Flutter size analysis
        shell: bash
        run: |
          mkdir -p build/size-analysis
          find .dart_tool/flutter_build -type f \
            \( -name '*code-size-analysis*.json' -o -name '*snapshot*.json' \) \
            -exec cp {} build/size-analysis/ \; 2>/dev/null || true
          ls -lh build/size-analysis || true

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Kelivo-Android-arm64-fast
          path: build/app/outputs/flutter-apk/*arm64-v8a*release.apk
          if-no-files-found: error

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: Kelivo-Android-arm64-symbols
          path: build/symbols/android
          if-no-files-found: error

      - name: Upload size analysis
        uses: actions/upload-artifact@v4
        with:
          name: Kelivo-Android-arm64-size-analysis
          path: |
            build/android-apk-largest-files.txt
            build/size-analysis/
          if-no-files-found: warn
